[Unit]
# Without this the service starts on a node whose ephemeral storage failed to
# mount, writes to the root filesystem instead and fills the disk the operating
# system runs on, with nothing reporting that anything is wrong until it is full.
# Refusing to start is the visible failure. See docs/impl-notes.adoc
RequiresMountsFor=/var/lib/kubelet /var/log/pods /var/lib/containerd

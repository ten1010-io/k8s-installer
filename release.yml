# Release metadata of this source tree.
#
# A release pins every component the installer deploys, so a cluster is described
# by this release and the kubernetes minor it was told to run rather than by a
# combination of component versions. setup.sh places this file in the installer
# directory, and setup-k8s-installer.yml stamps the version onto every managed
# node once the deployment succeeds.
#
# *** the version is the kubernetes version this release was cut around ***
#
#   major  the kubernetes major. It moves when kubernetes moves and not before
#   minor  the highest kubernetes minor of k8s_versions below. 1.36.x is the
#          release whose window tops out at kubernetes 1.36
#   patch  everything else: a fix to what is in this repository, a different
#          package or image, a different pinned kubernetes patch, a minor added
#          to or dropped from the window while the top of it stays put
#
# So the version says which kubernetes a cluster can run without a table to look
# it up in, and that is the whole reason it is spelled this way.
#
# What it does not say is anything about the installer itself. A release that
# renames a variable of vars.yml or adds a group to inventory.yml is a patch like
# any other. Nothing is lost by that: upgradable_from below is what decides
# whether a release may be taken at all, and the playbooks stop and say what to
# edit when a file of the user is behind. But it does mean a patch is not
# automatically a quiet one, so read the release notes of one before taking it.
#
# A version ending in -SNAPSHOT is a development build. It keeps its name while
# its content changes, which makes it the one thing a release version must never
# be: ambiguous. Two nodes both reporting 1.36.0-SNAPSHOT are not known to hold
# the same thing, so the checks that compare versions can not do their job, and
# neither upgradable_from below nor the changed flags of a release describe a
# delta from it. That leaves a snapshot with exactly one transition:
#
#   - setup.sh installs it like any other version
#   - upgrade.sh replaces a snapshot with itself, which is a redeploy rather than
#     an upgrade, as often as development needs
#   - upgrade.sh refuses to move a node off a snapshot. Reset and set up again
#   - a cluster upgrade must refuse to start from a snapshot altogether, since the
#     delta it would have to apply is undefined
#
# Upgrading a release to a snapshot is allowed, because it is the only way to try
# an upgrade path out before the release is cut. The cluster it produces is a
# development cluster and can only be rebuilt from there.
version: "1.36.0-SNAPSHOT"

# The kubernetes minors this release can deploy, and the patch each one is pinned
# to. k8s_minor_version of vars.yml names one of these keys and k8s_version of
# constant-vars.yml is what that key holds, so a cluster only ever runs a patch
# this release was built around. A minor the user asks for that is not a key here
# is refused by validate-hostvars.py before anything is touched.
#
# Three keys at most, which is the window kubernetes itself supports, and the
# highest key is the minor of the version above. A minor leaves the window when
# the top moves, so a release supporting 1.35, 1.34 and 1.33 can not take a
# cluster still on 1.32: that cluster reaches 1.33 on the release it is already
# on, and is upgraded after. check-cluster-upgradable.yml says so before the
# first node is touched.
#
# Every key costs bundle. The packages of that minor and the images its kubeadm
# asks for are all carried, one directory per minor, and the images have to be
# listed by asking the kubeadm of that minor rather than by editing the versions
# in the list a different one answered. See ki-cp-k8s-registry-images.yml.
#
# Only the packages and the images are per minor. The user binaries of bundle/bin
# are one set for the whole window, which holds while the window does not span an
# etcd or a helm the single etcdctl in there can not talk to.
#
# kubernetes  the patch of that minor this release runs
# pause       the sandbox image of that minor, which is the pause its kubeadm
#             asks for. containerd pulls the sandbox itself rather than being
#             told about it by kubelet, so its configuration carries this and a
#             wrong one is a node where nothing starts. It sits here beside the
#             patch it follows rather than in the image list, because the nodes
#             read this file and never that one, and build-bundle-images.sh
#             refuses to build when the two disagree
k8s_versions:
  "1.36":
    kubernetes: "v1.36.4"
    pause: "3.10.2"
  "1.35":
    kubernetes: "v1.35.8"
    pause: "3.10.1"
  "1.34":
    kubernetes: "v1.34.11"
    pause: "3.10.1"

# The packages this release chose, as the upstream version of each.
#
# These are the ones that do not come from the distribution: they are fetched from
# the repository of whoever makes them, which is why the same name and the same
# upstream version exist on every os the installer supports. Choosing them is what
# a release does, so they are what a release can state.
#
# The rest of bundle/linux-packages is the dependency closure an offline install
# needs, such as systemd, libselinux and nettle. Those are whatever the os
# repository served, they are named and versioned differently on each os, and
# nobody picked them, so writing them down here would be churn rather than a
# statement. They are not declared and not checked.
#
# install-packages.sh reads this before it installs anything and refuses a bundle
# that does not hold what is written here. A package named here and missing from
# the bundle is the same refusal: half the reason to write a version down is to
# catch a directory that was filled from the wrong place, and an empty one is that
# with the evidence removed.
#
# What is compared is the upstream version alone, without the epoch and the
# packaging release around it, because those differ per os by design. 28.5.2 is
# docker-ce_5:28.5.2-1~ubuntu.22.04~jammy on one node and docker-ce-28.5.2-1.el8
# on another, and both are the docker this release names.
#
# The packages of kubernetes are not here. Those are pinned per minor by
# k8s_versions above, and which of the three a node is handed depends on the
# minor its cluster runs
packages:
  containerd.io: "2.3.5"
  docker-ce: "29.8.1"
  docker-ce-cli: "29.8.1"
  docker-ce-rootless-extras: "29.8.1"
  docker-buildx-plugin: "0.37.1"
  docker-compose-plugin: "5.5.1"
  libnvidia-container1: "1.20.1"
  libnvidia-container-tools: "1.20.1"
  nvidia-container-toolkit: "1.20.1"
  nvidia-container-toolkit-base: "1.20.1"

# The binaries of bundle/bin, which are one set for the whole window rather than
# one per minor. helm, etcdctl, etcdutl and nerdctl are laid down under
# /usr/local/bin for whoever runs the cluster, so these are the versions a user
# sees; yq and crane are what the installer itself runs on.
#
# install-programs.sh checks these the only way they can be checked, by asking
# each binary. A package carries its version in the file; bundle/bin holds a file
# called "helm" and nothing about the name says which helm it is, which is the
# whole reason a bundle can quietly hold a different one.
#
# Each tool is asked its own way and answers in its own shape, so adding a name
# here means teaching that script the invocation. It refuses a name it does not
# know rather than passing it
#
# etcdctl and etcdutl follow the etcd kubeadm deploys rather than the newest etcd
# there is. restore-etcd.sh has etcdutl write a data directory that the etcd of the
# cluster then serves, and a newer etcdutl writing for an older server is the
# direction that breaks. The kubeadm of this window asks for 3.6.x
binaries:
  helm: "4.3.0"
  etcdctl: "3.6.14"
  etcdutl: "3.6.14"
  nerdctl: "2.4.0"
  yq: "4.53.6"
  crane: "0.22.1"

# Releases that upgrade.sh and upgrade-k8s-installer.yml accept as a starting
# point. Empty means this release can only be installed from scratch, which is the
# case for the first release that lays out the installer under /opt/k8s-installer.
# Earlier releases deployed to /var/lib/ki-env and carry no release file at all.
#
# Snapshots are never listed here. A customer never starts from one, and a
# development cluster that ran one is rebuilt rather than upgraded
upgradable_from: []

# The bundle is one archive per release, named after the whole version: release
# 1.36.1 reads bundle-1.36.1.tgz and nothing else reads it. A patch therefore
# publishes a bundle of its own, and that is what lets a patch carry a different
# package, a different image or a different pinned kubernetes patch at all.
#
# *** a published bundle is never rebuilt ***
#
# Two nodes reporting the same release hold the same thing, and that is only true
# while the object a release names keeps the content it was published with.
# Nothing enforces it beyond the permissions on the bucket and this sentence.
#
# A snapshot is the exception and has to be, since it keeps its name while its
# content changes: bundle-1.36.0-SNAPSHOT.tgz is overwritten as often as
# development needs. Keep it somewhere a release bundle can not be overwritten
# along with it

# The images the ki-cp-k8s-registry serves, which are the ones kubeadm asks for,
# declared one block per kubernetes minor. The keys are the minors that
# k8s_versions of release.yml carries, and build-bundle-images.sh refuses to
# build when one of them has no block here: the bundle holds the images of every
# minor the release supports and a registry is filled from the directory of the
# one its cluster runs.
#
# The name of this file is the name of the registry, and build-bundle-images.sh
# puts what it declares under a bundle directory named after it in turn, so a
# registry is added by adding a file rather than by editing a shared list.
#
# *** ask the kubeadm of the minor, not the one already installed ***
#
# The list comes from "kubeadm config images list --kubernetes-version <version>",
# and that command has to be run with the kubeadm binary of the minor the block
# belongs to. Only the four kube- images follow the version passed to it. The
# versions of coredns, pause and etcd are compiled into kubeadm itself, so any
# other kubeadm answers the question with its own and does it without complaining:
#
#   kubeadm 1.35, asked for v1.36.0  ->  coredns v1.13.1, pause 3.10.1, etcd 3.6.6-0
#   kubeadm 1.36, asked for v1.36.0  ->  coredns v1.14.2, pause 3.10.2, etcd 3.6.8-0
#
# All three differ. Writing the block of one minor by copying another and editing
# the kube- versions therefore leaves the registry without the images that minor
# will look for, and in an air gap there is nowhere else to get them: the cluster
# fails at the preflight that pulls them. Extract the binary from the package in
# linux-packages and run it, or run the command on a node already on that version.
#
# The mapping under each block is there because kubeadm looks for coredns directly
# under imageRepository rather than under the coredns path it upstream sits in, and
# it is per block because the tag it asks for is one of the three that differ
"1.36":
  images:
    - registry.k8s.io/kube-apiserver:v1.36.4
    - registry.k8s.io/kube-controller-manager:v1.36.4
    - registry.k8s.io/kube-scheduler:v1.36.4
    - registry.k8s.io/kube-proxy:v1.36.4
    - registry.k8s.io/coredns/coredns:v1.14.2
    - registry.k8s.io/pause:3.10.2
    - registry.k8s.io/etcd:3.6.8-0

  mappings:
    - from: registry.k8s.io/coredns/coredns:v1.14.2
      to: coredns:v1.14.2

"1.35":
  images:
    - registry.k8s.io/kube-apiserver:v1.35.8
    - registry.k8s.io/kube-controller-manager:v1.35.8
    - registry.k8s.io/kube-scheduler:v1.35.8
    - registry.k8s.io/kube-proxy:v1.35.8
    - registry.k8s.io/coredns/coredns:v1.13.1
    - registry.k8s.io/pause:3.10.1
    - registry.k8s.io/etcd:3.6.6-0

  mappings:
    - from: registry.k8s.io/coredns/coredns:v1.13.1
      to: coredns:v1.13.1

"1.34":
  images:
    - registry.k8s.io/kube-apiserver:v1.34.11
    - registry.k8s.io/kube-controller-manager:v1.34.11
    - registry.k8s.io/kube-scheduler:v1.34.11
    - registry.k8s.io/kube-proxy:v1.34.11
    - registry.k8s.io/coredns/coredns:v1.12.1
    - registry.k8s.io/pause:3.10.1
    - registry.k8s.io/etcd:3.6.5-0

  mappings:
    - from: registry.k8s.io/coredns/coredns:v1.12.1
      to: coredns:v1.12.1

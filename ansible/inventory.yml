control_node:
  hosts:
    localhost:
      ansible_connection: local
      # Which node of the inventory this control node is. It must be a node of the
      # ki_cp_node group, because every node of that group holds a copy of the
      # ansible directory so that any of them can take over as the control node.
      # Moving the control node to another one is this line and nothing else
      control_node_ih: node1

all:
  hosts:
    node1:
      ansible_host: 192.168.0.1
    node2:
      ansible_host: 192.168.0.2
    node3:
      ansible_host: 192.168.0.3
    node4:
      ansible_host: 192.168.0.4

ki_cp_node:
  hosts:
    node1: {}
    node2: {}

k8s_node:
  hosts:
    node1:
      k8s_cp: true
      # Kubelet reservations are calculated from the resources of the node.
      # Override a variable here to pin it for this node only
      #kubelet_system_reserved_cpu: "1"
      #kubelet_system_reserved_memory: "4Gi"
    node2:
      k8s_cp: true
    node3:
      k8s_cp: true
      # Pci devices of this node to bind to vfio-pci, so that a virtual machine
      # can be given one. vendor:device as lspci -nn prints it, and every device
      # of that model on the node is bound. Not only gpus: a network card or a
      # usb controller is named the same way. A card bound here is not a card
      # containers can use, so it does not go with nvidia_gpu on the same node,
      # which is why it is shown here rather than on the node below
      #vfio_pci_device_ids:
      #  - "10de:2230"
      #  - "10de:1aef"
      # Set this when the ids above cover every gpu of the node, so that the
      # driver of the vendor is left with none. It says what no list of ids can:
      # that the gpus still on the driver of a node were meant to stay there.
      # Without it a node that lost its cards to something and a node that gave
      # them away on purpose look the same, and they want opposite answers.
      # setup-vfio-pci.sh refuses a node where this does not match what it finds
      #gpu_passthrough: true
    node4:
      nvidia_gpu: true
      # The device given here holds everything kubelet accounts as ephemeral
      # storage. It gets formatted, so it has to be a disk with nothing on it
      #ephemeral_storage_device: "/dev/disk/by-id/nvme-eui.0123456789abcdef"

# Nodes that can no longer be reached. Every playbook leaves them alone, so that
# losing one node does not stop the installer from working on the others. A node
# is put here while it is down and taken out once it has been rebuilt, and
# remove-broken-node.yml is what takes it out of the cluster in the meantime
broken_node:
  hosts: {}

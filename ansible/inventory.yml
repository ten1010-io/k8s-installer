control_node:
  hosts:
    localhost:
      ansible_connection: local
      # Which node of the inventory this control node is. It must be a node of the
      # ki_cp_node group, because every node of that group holds a copy of the
      # ansible directory so that any of them can take over as the control node.
      # Moving the control node to another one is this line and nothing else
      control_node_ih: node1

all:
  hosts:
    node1:
      ansible_host: 192.168.0.1
    node2:
      ansible_host: 192.168.0.2
    node3:
      ansible_host: 192.168.0.3
    node4:
      ansible_host: 192.168.0.4

ki_cp_node:
  hosts:
    node1: {}
    node2: {}

k8s_node:
  hosts:
    node1:
      k8s_cp: true
      # Kubelet reservations are calculated from the resources of the node.
      # Override a variable here to pin it for this node only
      #kubelet_system_reserved_cpu: "1"
      #kubelet_system_reserved_memory: "4Gi"
    node2:
      k8s_cp: true
    node3:
      k8s_cp: true
    node4:
      nvidia_gpu: true

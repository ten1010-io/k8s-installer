ansible_python_interpreter: "{{ ki_opt_venv_path }}/bin/python3"
ansible_port: 22
ansible_ssh_user: root

# The installer is deployed as a self contained package under /opt, following the
# FHS convention for add-on software. Configuration lives in ki_etc_root_path and
# variable data in ki_var_root_path, so the whole deployment is removed by
# deleting this one directory
# Jinja2 template can not be used for ki_opt_root_path. since it is used without jinja2 engine
ki_opt_root_path: "/opt/k8s-installer"
# Don't modify ki_opt_scripts_path. since it is hardcoded in setup.sh, setup-venv.sh
ki_opt_scripts_path: "{{ ki_opt_root_path }}/scripts"
# Don't modify ki_opt_bundle_path. since it is hardcoded in setup.sh, setup-venv.sh
ki_opt_bundle_path: "{{ ki_opt_root_path }}/bundle"
# Don't modify ki_opt_venv_path. since it is hardcoded in setup.sh, setup-venv.sh
ki_opt_venv_path: "{{ ki_opt_root_path }}/venv"
# Holds nothing but the release version. Written as the last step of
# setup-k8s-installer.yml, so its presence means the node holds a complete
# deployment of that release, and a node that failed half way through has no file
ki_opt_release_path: "{{ ki_opt_root_path }}/release"
# Release metadata of the source tree, placed by setup.sh. Only the control node
# needs it, since it is what decides whether the managed nodes are upgradable
ki_opt_release_meta_path: "{{ ki_opt_root_path }}/release.yml"
# Held by every node of the ki_cp_node group, so that any of them can be used as
# the control node after the one in use is lost. The control node is required to
# be a member of that group for exactly this reason
ki_opt_ansible_path: "{{ ki_opt_root_path }}/ansible"

# The node of the inventory that the control node is, declared in inventory.yml
# and read here so that every host can compare itself against it. What the
# playbooks do to the other nodes would break the run if it were done to this one,
# since it is the node ansible itself runs out of. check-control-node.yml rejects
# a declaration that points elsewhere, and validate-hostvars.py checks it again
# against the localhost_ih that gather-facts derives from the hostnames
ki_control_node_ih: "{{ hostvars['localhost']['control_node_ih'] | default(None) }}"

# A lookup always runs on the control node, so these read the release metadata of
# the source tree even while a play targets the managed nodes
ki_release_version: "{{ (lookup('file', ki_opt_release_meta_path) | from_yaml)['version'] }}"
ki_release_upgradable_from: "{{ (lookup('file', ki_opt_release_meta_path) | from_yaml)['upgradable_from'] }}"
# A version carrying this suffix is a development build. It keeps its name while
# its content changes, so a node holding one can only have it replaced by itself.
# See release.yml. Kept in sync with SNAPSHOT_SUFFIX of setup.sh and upgrade.sh
ki_release_snapshot_suffix: "-SNAPSHOT"

# The nodes that can no longer be reached, declared as the broken_node group of
# inventory.yml. Every play excludes that group by pattern, which has to name it
# literally because a host pattern is resolved before any variable exists, and
# everything else that walks the inventory subtracts this list
ki_broken_nodes: "{{ groups['broken_node'] | default([]) }}"

ki_tmp_root_path: "/tmp/k8s-installer"
ki_tmp_localhost_vars_path: "{{ ki_tmp_root_path }}/localhost-vars.yml"
ki_tmp_vars_path: "{{ ki_tmp_root_path }}/vars.yml"
ki_tmp_pki_path: "{{ ki_tmp_root_path }}/pki"
ki_tmp_ki_ca_crt_path: "{{ ki_tmp_root_path }}/ki-ca.crt"
ki_tmp_join_credentials_path: "{{ ki_tmp_root_path }}/join-credentials.yml"
# The source and the destination of an archive are named apart so that each side
# owns the file it cleans up. A control node that is also a managed node holds
# both, and the names say which play is responsible for which
ki_tmp_payload_src_path: "{{ ki_tmp_root_path }}/payload-src.tar"
ki_tmp_payload_path: "{{ ki_tmp_root_path }}/payload.tar"
ki_tmp_ansible_src_path: "{{ ki_tmp_root_path }}/ansible-src.tar"
ki_tmp_ansible_path: "{{ ki_tmp_root_path }}/ansible.tar"

ki_etc_root_path: "/etc/k8s-installer"
ki_etc_pki_path: "{{ ki_etc_root_path }}/pki"
ki_etc_services_path: "{{ ki_etc_root_path }}/services"
ki_etc_kubeadm_path: "{{ ki_etc_root_path }}/kubeadm"
# What every node of the inventory reported the last time gather-facts reached
# it. Held by every node of the ki_cp_node group and rewritten on every run, so
# that a node that can no longer be reached can still be named by the playbooks
# that have to clean up after it. Nothing is derived from it while a node
# answers, since what the node itself reports is always the fresher answer
ki_etc_nodes_path: "{{ ki_etc_root_path }}/nodes.yml"
# The values of the classified variables as they were when this node was last
# built or updated. Held by every node, since some of them are set per node in
# inventory.yml, and written only after the run that applied them succeeded, so
# what is in it is what the node is actually running with. update-cluster.yml
# compares vars.yml against this to work out what changed and what that needs
ki_etc_applied_vars_path: "{{ ki_etc_root_path }}/applied-vars.yml"
# The release this node was last built or updated with, written next to the
# variables by the same play and for the same reason. ki_opt_release_path is the
# release the installer on the node holds, which upgrade-k8s-installer.yml raises
# before a cluster upgrade begins, so by the time the cluster is touched it no
# longer says what the cluster was built with. This does
ki_etc_applied_release_path: "{{ ki_etc_root_path }}/applied-release"

# Where the ephemeral storage device of a node is mounted. /var/lib/kubelet,
# /var/log/pods and /var/lib/containerd are fixed paths and one device can not be
# mounted at all three, so it is mounted here once and its subdirectories are bind
# mounted onto them. See docs/impl-notes.adoc
ki_ephemeral_root_path: "{{ ki_var_root_path }}/ephemeral"

internal_network_ip: null
internal_network_zone: "ki.local"
internal_network_ki_cp_dns_name: "ki-cp.{{ internal_network_zone }}"

# The image of each ki cp service, named after the service that runs it. Both the
# compose file of the service and the tool that puts the image in the bundle read
# it from here, so that the bundle can not end up holding a version the service
# does not ask for
ki_cp_dns_server_image: "ubuntu/bind9:9.18-22.04_beta"
ki_cp_k8s_cp_lb_image: "haproxy:2.6"
ki_cp_keepalived_image: "osixia/keepalived:2.0.20"
ki_cp_ntp_server_image: "cturra/ntp:latest"
ki_cp_k8s_registry_image: "registry:2.8"

ki_cp_k8s_cp_lb_port: 16443
ki_cp_k8s_cp_lb_stats_port: 18404
# The runtime api of the load balancer, which lb-admin.sh drains a backend
# through. A path inside the container, under the one directory the haproxy
# user owns, and deliberately not published: reaching it means being able to
# talk to the docker daemon, which on these nodes is root already
ki_cp_k8s_cp_lb_admin_socket_path: "/var/lib/haproxy/admin.sock"
# Where the load balancer writes the state of its backends before a reload and
# reads it back after one, so that a node taken out of rotation stays out
# across a re-render of the configuration. Inside the container beside the
# admin socket, and gone when the container is replaced, which is right: a
# replacement starts from the configuration rather than from old state
ki_cp_k8s_cp_lb_server_state_path: "/var/lib/haproxy/server-state"
# Where the password of the stats page is kept, so that a run of the playbooks
# reuses the one the cluster already has rather than minting another. Every ki
# cp node holds the same one, which is what lets the control node move: the
# node reading it is always one that was given it. Inside the service
# directory, so that resetting the service takes it with everything else
ki_cp_k8s_cp_lb_stats_password_path: "{{ ki_etc_services_path }}/ki-cp-k8s-cp-lb/stats-password"
ki_cp_k8s_registry_port: 5000

k8s_version: "v1.34.1"
# Where kubeadm keeps the certificates of the cluster. Fixed by kubeadm
k8s_pki_path: "/etc/kubernetes/pki"
k8s_apiserver_port: 6443
k8s_service_subnet: "10.96.0.0/12"
k8s_pod_subnet: "10.244.0.0/16"
k8s_ca_certificate_validity_period: "87600h" # 87600h = 10 year
k8s_cp: false

nvidia_gpu: false

# How long before a certificate expires it starts being reported. Generous on
# purpose: the certificates kubeadm issues last three years and are renewed,
# while the ki pki lasts ten and its ca and its leaf expire together, which makes
# rebuilding the cluster the answer rather than a rotation. Both deadlines are
# only useful if they are seen coming
ki_cert_expiry_warning_days: 180

# What has to happen when a variable changes. update-cluster.yml compares the
# current values against ki_etc_applied_vars_path and decides from this table
# what to run, so a variable that is not listed here is one nothing knows how to
# apply. That is checked rather than assumed: a variable of vars.yml, or one set
# on a node in inventory.yml, missing from this table stops the run, so whoever
# adds one has to say what changing it means.
#
# Covers both files. Most of these are set once in vars.yml, some are only ever
# set per node in inventory.yml, and a few can be either: what a node is
# recorded with is the value that node ended up with, whichever file it came from
ki_var_classes:
  # Rendered into a ki cp service and picked up by re-rendering it. The nodes
  # and the cluster stay as they are
  service:
    - internal_network_extra_zone
    - internal_network_extra_zone_a_records
    - ki_cp_dns_dnssec_validation
    - ki_cp_dns_server_upstream_servers
    - ki_cp_ntp_server_upstream_servers
    # The address moves, the name does not. controlPlaneEndpoint is
    # ki-cp.<zone>:<port>, so what a new vip needs is the dns server and
    # keepalived rendered again, not a cluster that knows a different endpoint
    - ki_cp_ha_mode_vip
  # Goes into the kubelet configuration. Applied by writing it again and
  # restarting kubelet, which does not stop the containers already running:
  # containerd keeps them and kubelet picks them back up. The reservations only
  # feed scheduler accounting, and a tightened evictionHard evicting a pod is
  # the point of tightening it
  kubelet:
    - kubelet_auto_ephemeral_storage_max
    - kubelet_auto_ephemeral_storage_min
    - kubelet_auto_memory_available_max
    - kubelet_auto_memory_available_min
    - kubelet_auto_nodefs_available_max
    - kubelet_auto_nodefs_available_min
    - kubelet_eviction_hard_imagefs_available
    - kubelet_eviction_hard_memory_available
    - kubelet_eviction_hard_nodefs_available
    - kubelet_eviction_hard_nodefs_inodes_free
    - kubelet_ki_cp_extra_cpu
    - kubelet_ki_cp_extra_memory
    - kubelet_kube_reserved_cpu
    - kubelet_kube_reserved_ephemeral_storage
    - kubelet_kube_reserved_memory
    - kubelet_kube_reserved_pid
    - kubelet_system_reserved_cpu
    - kubelet_system_reserved_ephemeral_storage
    - kubelet_system_reserved_memory
    - kubelet_system_reserved_pid
  # Written into the kubeadm configuration of the cluster and read the next time
  # kubeadm issues something. Nothing already issued changes: a shorter validity
  # period applies to the certificates renewed after it, not to the ones held
  cluster_config:
    - k8s_certificate_validity_period
  # Decided while a node is being provisioned and not reachable afterwards. The
  # device is formatted, the container and installer state lives under these
  # paths, so moving any of them means the node is built again rather than
  # edited. update-cluster.yml names the nodes and stops
  #
  # The ones set per node in inventory.yml sit here for the same reason. Whether
  # a node runs the control plane decides whether it carries an etcd member,
  # which is not something to add or drop under a node that is running, and the
  # gpu setup and the address a node is published under are the same kind of
  # thing
  node_rebuild:
    - docker_root_path
    - ephemeral_storage_device
    - internal_network_ip
    - k8s_cp
    - ki_var_root_path
    - nvidia_gpu
  # Changing it needs nothing done to any node. sync-ansible.yml already keeps
  # the ansible directory of every ki cp node in step, so moving the control
  # node is this declaration and nothing else.
  #
  # For anything in this class that a node does hold, nothing to apply is not
  # nothing to record: the new value is written to ki_etc_applied_vars_path like
  # any other, or every run after this one would go on reporting it as changed
  # against a file that never catches up
  no_action:
    # Declared on the localhost entry of inventory.yml and nowhere else, so no
    # node holds it and applied-vars.yml of a node does not carry it. That is
    # consistent rather than a gap: a variable that is not recorded is not
    # compared either, so it can not be reported as changed, and there would be
    # nothing to do about it if it were
    - control_node_ih
  # Not changeable on a cluster that exists. The subnets decide the internal
  # address of every node, which the etcd peers and the apiserver of each one
  # are published under, and turning ha mode on or off changes which services
  # run at all. update-cluster.yml refuses rather than applying half of it
  immutable:
    - internal_network_subnets
    - ki_cp_ha_mode

target_node: null
target_node_op: null

- import_playbook: tasks/begin-playbook.yml
  vars:
    playbook: "upgrade-cluster"

# The three plays of prepare-vars.yml are spelled out here rather than imported,
# because the upgradability check has to sit in the middle of them: after
# gather-facts, which is what works out which node the control plane is asked
# from, and before upgrade-k8s-registry, which is the first thing here that
# changes anything
- import_playbook: tasks/gather-facts.yml

- import_playbook: tasks/check-cluster-upgradable.yml

- import_playbook: tasks/validate-hostvars.yml

- import_playbook: tasks/setup-vars-file.yml

- import_playbook: tasks/backup-etcd.yml

- import_playbook: tasks/upgrade-k8s-registry.yml

- import_playbook: tasks/upgrade-k8s-nodes.yml

- import_playbook: tasks/record-applied-state.yml

- import_playbook: tasks/reset-vars-file.yml

- import_playbook: tasks/check-cert-expiry.yml

- import_playbook: tasks/begin-playbook.yml
  vars:
    playbook: "upgrade-cluster"

# The three plays of prepare-vars.yml are spelled out here rather than imported,
# because the upgradability check has to sit in the middle of them: after
# gather-facts, which is what works out which node the control plane is asked
# from, and before upgrade-k8s-registry, which is the first thing here that
# changes anything
- import_playbook: tasks/gather-facts.yml

- import_playbook: tasks/check-cluster-upgradable.yml

- import_playbook: tasks/validate-hostvars.yml

- import_playbook: tasks/setup-vars-file.yml

# The node checks every other playbook that works on a cluster runs, and this one
# did not. It is the playbook that needs them most: it pushes a whole release of
# images into the registry of every ki cp node, so a node that is nearly full
# fills up partway through and leaves the cluster with some nodes upgraded and
# some not. After setup-vars-file.yml, which is where the thresholds reach the
# node, and before the snapshot below, which a full disk would fail
- import_playbook: tasks/check-node-state.yml

- import_playbook: tasks/backup-etcd.yml

- import_playbook: tasks/upgrade-k8s-registry.yml

- import_playbook: tasks/apply-k8s-cp-extra-files.yml

- import_playbook: tasks/upgrade-k8s-nodes.yml

# Here as well as in update-cluster.yml, because what the release before this one
# left on the node objects is nothing: a cluster reaches this release by being
# upgraded, and the labels of its inventory and the ki cp label would otherwise
# wait for whenever somebody next happened to run update-cluster.yml. It reads
# each node's record itself, so it removes what the inventory dropped here too
- import_playbook: tasks/apply-node-metadata.yml

# Only the classes this playbook applies. kubeadm reads its configuration out
# of the cluster rather than out of vars.yml, so kubelet, cluster_config and
# control_plane are not applied here, and node_rebuild and immutable are not
# applied anywhere: recording any of them would say the node holds a value
# nothing put on it, and for the two blocking classes it would also be what
# stops update-cluster.yml from ever refusing the change again.
#
# node_kernel is here because upgrade-k8s-nodes.yml writes those files on every
# node it walks. Left out, a cluster that came up this way would carry no record
# of what it was given, and the next update-cluster.yml would read today's
# inventory as the starting point rather than as a change to apply
- import_playbook: tasks/record-applied-state.yml
  vars:
    ki_recorded_classes: ["cluster_upgrade", "service", "no_action", "node_metadata", "node_kernel"]

- import_playbook: tasks/reset-vars-file.yml

- import_playbook: tasks/check-cert-expiry.yml

- import_playbook: tasks/check-vfio-pci.yml

- import_playbook: tasks/check-kernel-args.yml

- import_playbook: tasks/check-nvidia-cdi.yml

- import_playbook: tasks/check-k8s-cp-file-drift.yml

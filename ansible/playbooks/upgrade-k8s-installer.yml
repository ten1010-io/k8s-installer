- import_playbook: tasks/check-control-node.yml

# Replaces the installer on the managed nodes with the one of the source tree this
# was run from. Like setup-k8s-installer.yml it uses the raw module, because the
# virtual environment the managed nodes would otherwise run modules from is itself
# being replaced part way through
#
# The control node is left out. upgrade.sh already brought its installer to this
# release, and replacing it from here would pull the virtual environment out from
# under the ansible run
- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check ssh connection
      raw: "echo ok"

    - name: Read release file
      raw: "sudo cat {{ ki_opt_release_path }}"
      register: raw_result

    - name: "Set_fact variable[\"node_release\"]"
      set_fact:
        node_release: "{{ raw_result.stdout | trim }}"

    - name: "Remove temporary variable[\"raw_result\"]"
      set_fact:
        raw_result: null

# Every node is checked before any of them is touched, so a cluster whose nodes
# drifted apart is reported in full instead of failing half way through an upgrade
- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check the control node already holds this release
      fail:
        msg: >-
          Node["{{ ki_control_node_ih }}"] is the control node and holds
          release["{{ hostvars[ki_control_node_ih]['node_release'] }}"] rather than
          release["{{ ki_release_version }}"]. Run upgrade.sh on it first
      when: hostvars[ki_control_node_ih]['node_release'] != ki_release_version

    # A node already holding this release is accepted, so that a run which failed
    # part way through can simply be repeated
    - name: Check every other node holds a release that is upgradable to this one
      fail:
        msg: >-
          Node["{{ item }}"] holds release["{{ hostvars[item]['node_release'] }}"], which is not
          one of the releases["{{ ki_release_upgradable_from | join(', ') }}"] that
          release["{{ ki_release_version }}"] can be upgraded from
      when:
        - item != ki_control_node_ih
        - hostvars[item]['node_release'] not in ki_release_upgradable_from
        - hostvars[item]['node_release'] != ki_release_version
      with_items: "{{ groups['all'] | community.general.lists_difference(['localhost']) | difference(ki_broken_nodes) }}"

    - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "sudo mkdir -p {{ ki_tmp_root_path }}"

    - name: Create payload archive
      shell: "sudo tar cf {{ ki_tmp_payload_src_path }} -C {{ ki_opt_root_path }} bundle scripts"

- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - when: inventory_hostname != ki_control_node_ih
      block:
        # Removed first, so that a node reports itself as not deployed for the
        # whole window in which it holds neither release completely
        - name: Delete release file
          raw: "sudo rm -f {{ ki_opt_release_path }}"

        - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
          raw: "sudo mkdir -p {{ ki_tmp_root_path }}"

        - name: Copy payload to the node
          delegate_to: localhost
          shell: "sudo scp {{ ssh_opt }} {{ port_opt }} {{ src_arg }} {{ dst_arg }}"
          vars:
            ssh_opt: "-o StrictHostKeyChecking=no"
            port_opt: "-P {{ ansible_port }}"
            src_arg: "{{ ki_tmp_payload_src_path }}"
            dst_arg: "{{ ansible_ssh_user }}@{{ ansible_host }}:{{ ki_tmp_payload_path }}"

        - name: Extract payload
          raw: "sudo rm -rf {{ ki_opt_bundle_path }} {{ ki_opt_scripts_path }} && sudo tar xf {{ ki_tmp_payload_path }} -C {{ ki_opt_root_path }}"

        - name: Delete temporary payload archive
          raw: "sudo rm -f {{ ki_tmp_payload_path }}"

        - name: Execute setup-venv.sh --force
          raw: "sudo {{ ki_opt_scripts_path }}/setup-venv.sh --root-path {{ ki_opt_root_path }} --force"

        - name: Execute write-release.sh
          raw: "sudo {{ ki_opt_scripts_path }}/write-release.sh --root-path {{ ki_opt_root_path }} --version {{ ki_release_version }}"

- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Delete temporary payload archive
      shell: "sudo rm -f {{ ki_tmp_payload_src_path }}"

- import_playbook: tasks/sync-ansible.yml

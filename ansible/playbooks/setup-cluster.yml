- import_playbook: tasks/begin-playbook.yml
  vars:
    playbook: "setup-cluster"

# Before prepare-vars.yml, whose gather-facts measures the filesystem this
# provides. See tasks/setup-ephemeral-storage.yml
- import_playbook: tasks/setup-ephemeral-storage.yml

- import_playbook: tasks/prepare-vars.yml

- import_playbook: tasks/check-node-state.yml

# Before anything is built on the node, because this is the last point at which
# rebooting it is free. See tasks/setup-boot-config.yml
- import_playbook: tasks/setup-boot-config.yml

- import_playbook: tasks/init-pki.yml

- import_playbook: tasks/setup-ki-ca-crt.yml

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/linux-package/install-packages.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/nfs-client/setup-nfs-client.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/crictl/setup-crictl.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/linux-bin/install-programs.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/containerd/setup-containerd.sh

- import_playbook: tasks/run-all-node-script-control-node-last.yml
  vars:
    script: all-node/docker/setup-docker.sh

- import_playbook: tasks/init-ki-cp.yml

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/resolv-conf/setup-resolv-conf.sh
    every_node: true

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/ntp-client/setup-ntp-client.sh

- import_playbook: tasks/apply-k8s-cp-extra-files.yml

- import_playbook: tasks/init-k8s-cluster.yml

- import_playbook: tasks/apply-node-metadata.yml

- import_playbook: tasks/record-applied-state.yml
  vars:
    ki_recorded_classes: all

- import_playbook: tasks/reset-vars-file.yml

- import_playbook: tasks/check-cert-expiry.yml

- import_playbook: tasks/check-vfio-pci.yml

- import_playbook: tasks/check-kernel-args.yml

- import_playbook: tasks/check-nvidia-cdi.yml

- import_playbook: tasks/check-k8s-cp-file-drift.yml

- import_playbook: tasks/begin-playbook.yml
  vars:
    playbook: "update-cluster"

- import_playbook: tasks/prepare-vars.yml

- import_playbook: tasks/diff-applied-vars.yml

- import_playbook: tasks/apply-service-var-changes.yml

# Before class["kubelet"], not after. Both write the same file on a node, and
# this one is the one that can not be applied by a restart: a node whose policy
# changed has to be drained and have its checkpoint taken away first, and a
# class["kubelet"] restart reaching it before that happens is a kubelet that
# reads the new policy, refuses to start and says nothing, because systemctl
# returns as soon as a unit carrying Restart=always has been started
- import_playbook: tasks/apply-kubelet-policy-var-changes.yml

- import_playbook: tasks/apply-kubelet-var-changes.yml

- import_playbook: tasks/apply-cluster-config-var-changes.yml

- import_playbook: tasks/apply-k8s-cp-extra-files.yml

- import_playbook: tasks/apply-control-plane-changes.yml

- import_playbook: tasks/apply-node-metadata.yml

- import_playbook: tasks/apply-node-kernel-config.yml

- import_playbook: tasks/record-applied-state.yml
  vars:
    ki_recorded_classes: all

# The unit carries the declaration of the node in its ExecStart - the files and
# the mounted directories the drift check is given - so a playbook that changes
# that declaration has to write the unit again. class["cp_extra_files"] and
# class["control_plane"] are both applied here, and left out, the timer would go
# on measuring the declaration of the run before this one. The other three checks
# read class["node_rebuild"] variables, which this playbook refuses rather than
# applies, so the node is rebuilt and the unit written with it.
#
# It is also the way in for a cluster built before this existed: every other
# playbook that writes the unit either builds a node or upgrades one
- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/node-metrics/setup-node-metrics.sh

- import_playbook: tasks/reset-vars-file.yml

- import_playbook: tasks/check-vfio-pci.yml

- import_playbook: tasks/check-kernel-args.yml

- import_playbook: tasks/check-nvidia-cdi.yml

- import_playbook: tasks/check-kubelet-serving-cert.yml

- import_playbook: tasks/check-k8s-cp-file-drift.yml

# The environment preflight, run before anything is installed. It runs
# scripts/all-node/preflight-env.sh on every node and, by default, stops the run
# when a node reports a FAIL, so a customer environment that cannot meet the
# OS/network requirements (DNS, firewall ports, NTP, MTU, disk, swap, kernel) is
# caught here instead of midway through an install. Read-only on the nodes: the
# script only reports and prints the fix as a suggestion, it changes nothing.
#
# Runs on every node (not the control node, not a broken one). The node-to-node
# checks (ports, path MTU, RTT) need the other nodes' addresses, which are taken
# from the inventory (ansible_host) and passed as --peers.
#
#   ansible-playbook -i inventory.yml playbooks/preflight-env.yml
#     -e preflight_env_names="ki-cp.ki.local app.site"       # names that must resolve
#     -e preflight_env_egress="registry.site:443 ntp.site:123"  # external endpoints
#     -e preflight_env_pod_cidr=10.244.0.0/16 -e preflight_env_svc_cidr=10.96.0.0/12
#     -e preflight_env_vip=192.168.0.250                     # the keepalived VIP
#     -e preflight_env_strict=false                          # report only, never stop
- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    preflight_env_strict: true
    preflight_env_names: ""
    preflight_env_egress: ""
    preflight_env_pod_cidr: ""
    preflight_env_svc_cidr: ""
    preflight_env_vip: ""
  tasks:
    - name: "Set_fact variable[\"preflight_env_peers\"] from the other nodes"
      set_fact:
        preflight_env_peers: >-
          {{ groups['all'] | difference([inventory_hostname])
             | map('extract', hostvars, 'ansible_host') | select('string') | list | join(' ') }}

    - name: "Execute preflight-env.sh"
      script: >-
        all-node/preflight-env.sh
        --peers "{{ preflight_env_peers }}"
        {% if preflight_env_names %}--names "{{ preflight_env_names }}"{% endif %}
        {% if preflight_env_egress %}--egress "{{ preflight_env_egress }}"{% endif %}
        {% if preflight_env_pod_cidr %}--pod-cidr "{{ preflight_env_pod_cidr }}"{% endif %}
        {% if preflight_env_svc_cidr %}--svc-cidr "{{ preflight_env_svc_cidr }}"{% endif %}
        {% if preflight_env_vip %}--vip "{{ preflight_env_vip }}"{% endif %}
      register: preflight_env_result
      changed_when: false
      failed_when: false

    - name: "Show the environment preflight of this node"
      debug:
        msg: "{{ preflight_env_result.stdout_lines }}"

    - name: "Fail when preflight-env.sh did not finish (no SUMMARY line)"
      fail:
        msg: >-
          preflight-env.sh did not run to its SUMMARY line on {{ inventory_hostname }}
          (rc={{ preflight_env_result.rc }}). stderr: {{ preflight_env_result.stderr | default('') }}
      when: preflight_env_result.rc != 0
            or (preflight_env_result.stdout | regex_search('(?m)^SUMMARY ')) is none

    - name: "Set_fact variable[\"preflight_env_fail\"] from the SUMMARY line"
      set_fact:
        preflight_env_fail: >-
          {{ preflight_env_result.stdout | regex_search('(?m)^SUMMARY .*')
          | default('', true) | regex_search('fail=[0-9]+')
          | default('fail=0', true) | regex_replace('fail=', '') }}

    - name: "Fail when a node does not meet the environment requirements"
      fail:
        msg: >-
          Environment preflight failed on {{ inventory_hostname }}: {{ preflight_env_fail }} FAIL row(s) above.
          Fix the [E-*] FAIL items and run this again, or pass -e preflight_env_strict=false to go on anyway.
      when:
        - preflight_env_strict | bool
        - preflight_env_fail | int > 0

- import_playbook: tasks/check-control-node.yml

# Deploys the installer itself to every node, which is what every other playbook
# depends on. It runs before the managed nodes have a python interpreter of their
# own, so the tasks that touch them use the raw module. Tasks that need a module
# are delegated to the control node, which always has one
#
# The control node is left out. Its installer directory is the one setup.sh built
# and the one this play copies from, and it is also the directory ansible itself
# is running out of
- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # Every script of this installer runs through sudo and nothing is there to
    # type a password, so a node that asks for one is refused here, at the first
    # task, rather than wherever the first sudo would have hung
    - name: Check ssh connection and passwordless sudo
      raw: "sudo -n true"

    # The bundle holds nothing a node of another architecture can run, and
    # nothing of an os it was not resolved for, and such a node used to find
    # that out from "exec format error" inside setup-venv.sh, after the payload
    # had been copied to it. Asked here, before anything is, and asked raw since
    # the node has no python of its own yet. The os is named the way
    # linux-packages names it: the id and the major for rhel, the id and the
    # whole version for ubuntu. See release.yml
    - name: Read the os and the architecture of the node
      raw: ". /etc/os-release && echo \"$ID $VERSION_ID $(uname -m)\""
      register: raw_result

    - name: "Set_fact variable[\"node_os\"] and variable[\"node_machine\"]"
      set_fact:
        node_os: >-
          {{ (raw_result.stdout | trim).split()[0]
          ~ ((raw_result.stdout | trim).split()[1].split('.')[0] if (raw_result.stdout | trim).split()[0] == 'rhel'
          else (raw_result.stdout | trim).split()[1]) }}
        node_machine: "{{ (raw_result.stdout | trim).split()[2] }}"

    - name: Check the node is of an os and an architecture the release is built for
      fail:
        msg: >-
          Node["{{ inventory_hostname }}"] is {{ node_machine }} running {{ node_os }} and the
          bundle of release["{{ ki_release_version }}"] carries
          {% if node_os in ki_release_architectures -%}
          {{ node_os }} for {{ ki_release_architectures[node_os] | join(', ') }} only.
          {%- else -%}
          no packages of {{ node_os }}.
          {%- endif %}
          Nothing in it can run on this node, so it is refused before the payload is copied to it
      when: node_os not in ki_release_architectures or node_machine not in ki_release_architectures[node_os]

    - name: "Remove temporary variable[\"raw_result\"]"
      set_fact:
        raw_result: null

- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "{{ ki_create_tmp_root_cmd }}"

    # The bundle holds thousands of files that are already compressed, so
    # the payload is bundled without compression. Bundling is what makes the
    # transfer fast, since scp pays a round trip per file
    - name: Create payload archive
      shell: "sudo tar cf {{ ki_tmp_payload_src_path }} -C {{ ki_opt_root_path }} bundle scripts"

- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - when: inventory_hostname != ki_control_node_ih
      block:
        - name: "Create directory[\"{{ ki_opt_root_path }}\"]"
          raw: "sudo mkdir -p {{ ki_opt_root_path }}"

        - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
          raw: "{{ ki_create_tmp_root_cmd }}"

        - name: Copy payload to the node
          delegate_to: localhost
          shell: "scp {{ ssh_opt }} {{ port_opt }} {{ src_arg }} {{ dst_arg }}"
          vars:
            ssh_opt: "-o StrictHostKeyChecking=no"
            port_opt: "-P {{ ansible_port }}"
            src_arg: "{{ ki_tmp_payload_src_path }}"
            dst_arg: "{{ ki_ssh_user }}@{{ ansible_host }}:{{ ki_tmp_payload_path }}"

        # Replaced rather than merged, so a node can not end up holding files of
        # two releases at once
        - name: Extract payload
          raw: "sudo rm -rf {{ ki_opt_bundle_path }} {{ ki_opt_scripts_path }} && sudo tar xf {{ ki_tmp_payload_path }} -C {{ ki_opt_root_path }}"

        - name: Delete temporary payload archive
          raw: "sudo rm -f {{ ki_tmp_payload_path }}"

        - name: Execute setup-venv.sh
          raw: "sudo {{ ki_opt_scripts_path }}/setup-venv.sh --root-path {{ ki_opt_root_path }}"

        - name: Execute write-release.sh
          raw: "sudo {{ ki_opt_scripts_path }}/write-release.sh --root-path {{ ki_opt_root_path }} --version {{ ki_release_version }}"

- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Delete temporary payload archive
      shell: "sudo rm -f {{ ki_tmp_payload_src_path }}"

- import_playbook: tasks/sync-ansible.yml

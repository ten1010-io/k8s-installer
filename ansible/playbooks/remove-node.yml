- import_playbook: tasks/begin-playbook.yml
  vars:
    playbook: "remove-node"

- import_playbook: tasks/prepare-vars.yml

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/check-node-state.sh
    every_node: true

# Not conditioned on the node being a control plane one. Removing one takes an
# etcd member out, which is the case this is most worth having, but the snapshot
# is taken on the cp nodes either way and removing a worker is still a change to
# the cluster. Deciding it here would also mean reading k8s_cp_nodes from a
# play that has not run yet
- import_playbook: tasks/backup-etcd.yml

- import_playbook: tasks/remove-k8s-node.yml
  when: target_node in groups['k8s_node']

- import_playbook: tasks/remove-ki-cp-node.yml
  when: target_node in groups['ki_cp_node']

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/resolv-conf/setup-resolv-conf.sh
    every_node: true

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/ntp-client/reset-ntp-client.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/resolv-conf/reset-resolv-conf.sh

- import_playbook: tasks/run-all-node-script-control-node-last.yml
  vars:
    script: all-node/docker/reset-docker.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/containerd/reset-containerd.sh

- import_playbook: tasks/reset-ephemeral-storage.yml

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/linux-bin/uninstall-programs.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/crictl/reset-crictl.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/nfs-client/reset-nfs-client.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/linux-package/uninstall-packages.sh

- import_playbook: tasks/run-all-node-script.yml
  vars:
    script: all-node/ki-ca-crt/reset-ki-ca-crt.sh

- import_playbook: tasks/reset-pki.yml
  when: target_node in groups['ki_cp_node']

- import_playbook: tasks/reset-vars-file.yml

- import_playbook: tasks/check-cert-expiry.yml

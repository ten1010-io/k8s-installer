- import_playbook: tasks/check-k8s-installer-setup.yml

- import_playbook: tasks/sync-ansible.yml

- import_playbook: tasks/preflight-playbook.yml
  vars:
    playbook: "remove-node"

- import_playbook: tasks/gather-facts.yml

- import_playbook: tasks/validate-hostvars.yml

- import_playbook: tasks/setup-vars-file.yml

- import_playbook: tasks/check-node-state.yml

# Not conditioned on the node being a control plane one. Removing one takes an
# etcd member out, which is the case this is most worth having, but the snapshot
# is taken on the cp nodes either way and removing a worker is still a change to
# the cluster. Deciding it here would also mean reading k8s_cp_nodes from a
# play that has not run yet
- import_playbook: tasks/backup-etcd.yml

- import_playbook: tasks/remove-k8s-node.yml
  when: target_node in groups['k8s_node']

- import_playbook: tasks/remove-ki-cp-node.yml
  when: target_node in groups['ki_cp_node']

- import_playbook: tasks/setup-all-node-resolv-conf.yml

- import_playbook: tasks/reset-ntp-client.yml

- import_playbook: tasks/reset-resolv-conf.yml

- import_playbook: tasks/reset-docker.yml

- import_playbook: tasks/reset-containerd.yml

- import_playbook: tasks/reset-ephemeral-storage.yml

- import_playbook: tasks/uninstall-programs.yml

- import_playbook: tasks/reset-crictl.yml

- import_playbook: tasks/reset-nfs-client.yml

- import_playbook: tasks/uninstall-packages.yml

- import_playbook: tasks/reset-ki-ca-crt.yml

- import_playbook: tasks/reset-pki.yml
  when: target_node in groups['ki_cp_node']

- import_playbook: tasks/reset-vars-file.yml

- import_playbook: tasks/check-cert-expiry.yml

- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Create pki directory
      shell: "sudo mkdir -p {{ ki_etc_pki_path }}"

- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_localhost_vars_path }}"
  tasks:
    # Run as the user ansible runs as rather than as root. It reads the
    # installer directory and writes under the temporary directory that user
    # owns, and the copy below reads what it wrote as that same user, which it
    # could not do with the private keys openssl writes for root alone
    - name: Execute create-pki.sh
      shell: "{{ ki_opt_scripts_path }}/localhost-node/create-pki.sh {{ vars_path_arg }}"

- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Copy pki to the node
      copy:
        src: "{{ ki_tmp_pki_path }}/{{ item.name }}"
        dest: "{{ ki_etc_pki_path }}/{{ item.name }}"
        mode: "{{ item.mode }}"
      become: yes
      loop: "{{ ki_pki_files }}"

- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Delete temporary pki directory
      shell: "sudo rm -rf {{ ki_tmp_pki_path }}"

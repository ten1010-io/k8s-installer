- hosts: all:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Check directory[\"{{ ki_opt_root_path }}\"] exists"
      shell: "sudo ls {{ ki_opt_root_path }}"

    - name: "Check directory[\"{{ ki_opt_scripts_path }}\"] exists"
      shell: "sudo ls {{ ki_opt_scripts_path }}"

    - name: "Check directory[\"{{ ki_opt_bundle_path }}\"] exists"
      shell: "sudo ls {{ ki_opt_bundle_path }}"

    - name: "Check directory[\"{{ ki_opt_venv_path }}\"] exists"
      shell: "sudo ls {{ ki_opt_venv_path }}"

    # Absent on a node whose deployment did not finish, so the missing file is
    # itself the answer rather than a missing check
    - name: "Check file[\"{{ ki_opt_release_path }}\"] exists"
      shell: "sudo cat {{ ki_opt_release_path }}"
      register: release_result

    - name: "Set_fact variable[\"node_release\"]"
      set_fact:
        node_release: "{{ release_result.stdout | trim }}"

# Only the ki cp nodes hold the ansible directory, and all of them do, so that any
# of them can be used as the control node after the one in use is lost
- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Check directory[\"{{ ki_opt_ansible_path }}\"] exists"
      shell: "sudo ls {{ ki_opt_ansible_path }}"

# A cluster is described by one release, so a node that drifted away from it is
# rejected here rather than discovered later by whichever task it breaks
- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check every node holds the release of the source tree
      fail:
        msg: >-
          Node["{{ item }}"] holds release["{{ hostvars[item]['node_release'] }}"]
          but the source tree is release["{{ ki_release_version }}"].
          Run the upgrade-k8s-installer.yml playbook to bring every node to the same release
      when: hostvars[item]['node_release'] != ki_release_version
      # A node of the broken_node group was not asked, so there is nothing of it
      # to compare. It is also the one node no upgrade could bring into line
      with_items: "{{ groups['all'] | difference(ki_broken_nodes) }}"

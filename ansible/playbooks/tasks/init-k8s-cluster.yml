- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute configure-linux.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/configure-linux.sh {{ vars_path_arg }}"

    - name: Execute setup-kernel-config.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/kernel-config/setup-kernel-config.sh {{ vars_path_arg }}"

    - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "{{ ki_create_tmp_root_cmd }}"

    - when: inventory_hostname == k8s_cp_nodes[0]
      block:
        - name: Execute init-k8s-cluster.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/init-k8s-cluster.sh {{ vars_path_arg }}"

        # kubeadm init returns once the apiserver of this node answers, and what
        # runs next reaches it through ki cp rather than through localhost:
        # admin.conf names the load balancer, whose backend only goes up once
        # /readyz returns 200. A freshly initialised apiserver reaches that well
        # after it starts answering at all, and nothing here waited for it, so a
        # clean install raced it and kubeadm spent a minute failing to reach a
        # cluster that was already running. The same wait is what
        # upgrade-k8s-nodes.yml puts a node back into rotation behind
        - name: Execute wait-k8s-apiserver.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/wait-k8s-apiserver.sh {{ vars_path_arg }}"

        - name: Execute create-join-credentials-file.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/create-join-credentials-file.sh {{ vars_path_arg }}"

- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "{{ ki_create_tmp_root_cmd }}"

    # Read on the node as root, since the script above wrote it as root, and
    # written on the control node as the user ansible runs as
    - name: Copy join-credentials.yml to ansible control node
      fetch:
        src: "{{ ki_tmp_join_credentials_path }}"
        dest: "{{ ki_tmp_join_credentials_path }}"
        flat: yes
      become: yes
      delegate_to: "{{ k8s_cp_nodes | first }}"

- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    # The token and the certificate key in it join a node to the cluster, so it
    # is readable by root alone for the minutes it exists
    - name: Copy join-credentials.yml to the node
      copy:
        src: "{{ ki_tmp_join_credentials_path }}"
        dest: "{{ ki_tmp_join_credentials_path }}"
        mode: "0600"
      become: yes

    - name: Execute join-k8s-cluster.sh on k8s cp nodes
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/join-k8s-cluster.sh {{ vars_path_arg }}"
      throttle: 1
      when: inventory_hostname in k8s_cp_nodes[1:]

    - name: Execute join-k8s-cluster.sh on k8s worker nodes
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/join-k8s-cluster.sh {{ vars_path_arg }}"
      when: inventory_hostname not in k8s_cp_nodes

- hosts: all:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Delete temporary join-credentials.yml file
      shell: "sudo rm -f {{ ki_tmp_join_credentials_path }}"

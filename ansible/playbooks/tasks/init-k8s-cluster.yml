- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute configure-linux.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/configure-linux.sh {{ vars_path_arg }}"

    - name: Execute setup-kernel-config.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/kernel-config/setup-kernel-config.sh {{ vars_path_arg }}"

    - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "{{ ki_create_tmp_root_cmd }}"

    - when: inventory_hostname == k8s_cp_nodes[0]
      block:
        - name: Execute init-k8s-cluster.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/init-k8s-cluster.sh {{ vars_path_arg }}"

        # kubeadm init returns once the apiserver of this node answers, and what
        # runs next reaches it through ki cp rather than through localhost:
        # admin.conf names the load balancer, whose backend only goes up once
        # /readyz returns 200. A freshly initialised apiserver reaches that well
        # after it starts answering at all, and nothing here waited for it, so a
        # clean install raced it and kubeadm spent a minute failing to reach a
        # cluster that was already running. The same wait is what
        # upgrade-k8s-nodes.yml puts a node back into rotation behind
        - name: Execute wait-k8s-apiserver.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/wait-k8s-apiserver.sh {{ vars_path_arg }}"

        - name: Execute create-join-credentials-file.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/create-join-credentials-file.sh {{ vars_path_arg }}"

- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "{{ ki_create_tmp_root_cmd }}"

- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    # Everything that carries the join credentials off the node that made them
    # is inside this block, so that the always below is what ends them however
    # the block ends. any_errors_fatal stops the play on every host at the first
    # failure, and a host stopped inside a block is still sent through its
    # always, so a join that fails on one node takes the token and the
    # certificate key off all of them rather than leaving them where the run
    # happened to stop
    - block:
        # Read on the node as root, since the script above wrote it as root, and
        # written on the control node as the user ansible runs as.
        #
        # To a path of its own rather than to the one a node keeps it at, which
        # is what this used to do. On a control node that is also the first k8s
        # cp node the two were then one file: this found what the script had
        # written as root already at its destination and left it alone, and the
        # copy below, handing that node its credentials like any other, set the
        # file to 0600. That closed the source of the copy to the user ansible
        # runs as while the nodes after it still had to read it, and they failed
        # with "Permission denied". Only the nodes after it, though: two nodes
        # handled at once had both read the file before either closed it, so the
        # same inventory passed one day and failed another. Nothing showed when
        # ansible ran as root, which reads the file whatever its mode says
        - name: Copy join-credentials.yml to ansible control node
          fetch:
            src: "{{ ki_tmp_join_credentials_path }}"
            dest: "{{ ki_tmp_join_credentials_src_path }}"
            flat: yes
          become: yes
          delegate_to: "{{ k8s_cp_nodes | first }}"
          run_once: true

        # fetch lays it down with the umask of the user ansible runs as. The
        # directory is what keeps the other users of the control node away from
        # it, and this says the same of the file, so that it does not rest on
        # where the file happens to be
        - name: Close join-credentials.yml of ansible control node to every other user
          file:
            path: "{{ ki_tmp_join_credentials_src_path }}"
            mode: "0600"
          delegate_to: localhost
          run_once: true

        # The token and the certificate key in it join a node to the cluster, so
        # it is readable by root alone for the minutes it exists. The node that
        # made it holds it already, and what this does there is close it
        - name: Copy join-credentials.yml to the node
          copy:
            src: "{{ ki_tmp_join_credentials_src_path }}"
            dest: "{{ ki_tmp_join_credentials_path }}"
            mode: "0600"
          become: yes

        - name: Execute join-k8s-cluster.sh on k8s cp nodes
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/join-k8s-cluster.sh {{ vars_path_arg }}"
          throttle: 1
          when: inventory_hostname in k8s_cp_nodes[1:]

        - name: Execute join-k8s-cluster.sh on k8s worker nodes
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/join-k8s-cluster.sh {{ vars_path_arg }}"
          when: inventory_hostname not in k8s_cp_nodes

      always:
        - name: Delete temporary join-credentials.yml file
          shell: "sudo rm -f {{ ki_tmp_join_credentials_path }}"

        # Without sudo, since the directory it is in belongs to the user ansible
        # runs as
        - name: Delete temporary join-credentials.yml file of ansible control node
          shell: "rm -f {{ ki_tmp_join_credentials_src_path }}"
          delegate_to: localhost
          run_once: true

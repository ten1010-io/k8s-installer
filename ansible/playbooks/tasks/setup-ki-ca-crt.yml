- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "{{ ki_create_tmp_root_cmd }}"

    - name: Copy ki-ca.crt to ansible control node
      fetch:
        src: "{{ ki_etc_pki_path }}/ki-ca.crt"
        dest: "{{ ki_tmp_ki_ca_crt_path }}"
        flat: yes
      become: yes
      delegate_to: "{{ src_ih }}"
      vars:
        src_ih: "{{ groups['ki_cp_node'] | difference(ki_broken_nodes) | first }}"

- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - when: target_node is none or inventory_hostname == target_node
      block:
        - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
          shell: "{{ ki_create_tmp_root_cmd }}"

        - name: Copy ki-ca.crt file to the node
          copy:
            src: "{{ ki_tmp_ki_ca_crt_path }}"
            dest: "{{ ki_tmp_ki_ca_crt_path }}"
            mode: "0644"
          become: yes

        - name: Execute setup-ki-ca-crt.sh
          shell: "sudo {{ ki_opt_scripts_path }}/all-node/ki-ca-crt/setup-ki-ca-crt.sh {{ vars_path_arg }}"

- hosts: all:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Delete temporary ki-ca.crt file
      shell: "sudo rm -f {{ ki_tmp_ki_ca_crt_path }}"

# Refuses a cluster upgrade before anything is touched, for the two reasons it
# can be refused at all: the cluster is starting from somewhere undefined, or it
# is being asked to make a jump kubernetes does not make.
#
# An upgrade applies a delta: the release names what it changed since the
# releases it can be upgraded from, and the playbooks carry the steps that delta
# needs. That only means something if the release the cluster is on is known.
#
# A snapshot keeps its name while its content changes, so two clusters both
# recording one are not known to hold the same thing and neither the
# upgradable_from list nor the changed flags of a release describe a delta from
# it. A cluster that records nothing at all was built before the record existed.
# Either way there is no delta to apply, and a run that went ahead anyway would
# be guessing at every step. See release.yml.
#
# The release of the installer is not the answer here. upgrade-k8s-installer.yml
# raises it on every node before the cluster is touched, so by this point it says
# where the cluster is going rather than where it is
- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # Absent on a cluster built before this file was recorded, which is an answer
    # of its own rather than a failure to read
    - name: "Read file[\"{{ ki_etc_applied_release_path }}\"]"
      shell: "sudo cat {{ ki_etc_applied_release_path }} 2>/dev/null || true"
      register: applied_release_result

    - name: "Set_fact variable[\"applied_release\"]"
      set_fact:
        applied_release: "{{ applied_release_result.stdout | trim }}"

# Every node is reported rather than the first one that fails, so a cluster whose
# nodes disagree is seen whole
- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check every node records the release its cluster was built with
      fail:
        msg: >-
          Node["{{ item }}"] does not record the release it was built or updated with, so
          there is no release for this upgrade to start from. A cluster built before that
          record existed is a development cluster: reset it and set it up again on
          release["{{ ki_release_version }}"]
      when:
        - allow_upgrading_from_snapshot is not defined
        - hostvars[item]['applied_release'] | length == 0
      with_items: "{{ groups['all'] | difference(['localhost']) | difference(ki_broken_nodes) }}"

    - name: Check no node is on a snapshot
      fail:
        msg: >-
          Node["{{ item }}"] is on release["{{ hostvars[item]['applied_release'] }}"], which is a
          snapshot, so what it holds is not described by any release and the delta up to
          release["{{ ki_release_version }}"] is undefined. A cluster that ran a snapshot is
          rebuilt rather than upgraded: reset it and set it up again
      when:
        - allow_upgrading_from_snapshot is not defined
        - hostvars[item]['applied_release'].endswith(ki_release_snapshot_suffix)
      with_items: "{{ groups['all'] | difference(['localhost']) | difference(ki_broken_nodes) }}"

# The kubernetes version the cluster records, asked of the node that would be the
# first one upgraded. Which release may upgrade to which is declared once, by
# upgradable_from in release.yml, and nothing here second guesses it. What is
# checked is the thing kubeadm enforces underneath that declaration, so that a
# release cut with the wrong upgradable_from is refused rather than discovered
# half way through
- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - when: inventory_hostname == k8s_cp_nodes[0]
      block:
        - name: Read the kubernetes version the cluster records
          shell: >-
            sudo kubectl -n kube-system get configmap kubeadm-config
            -o jsonpath='{.data.ClusterConfiguration}' 2>/dev/null
            | grep -oP '^kubernetesVersion: \K.+' || true
          register: cluster_k8s_version_result

        - name: "Set_fact variable[\"cluster_k8s_version\"]"
          set_fact:
            cluster_k8s_version: "{{ cluster_k8s_version_result.stdout | trim }}"

        - name: "Remove temporary variable[\"cluster_k8s_version_result\"]"
          set_fact:
            cluster_k8s_version_result: null

# What kubeadm allows is one minor at a time and never backwards. Reaching that
# answer with the node already drained, its packages replaced and its services
# written again is the worst place to find it: the run stops with that node
# holding the new release against a cluster on the old one. The same answer is
# available here, before the registry is filled and before the first node is
# taken out of the load balancer
- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    cluster_version: "{{ hostvars[k8s_cp_nodes[0]]['cluster_k8s_version'] | default('') }}"
    cluster_major: "{{ (cluster_version | replace('v', '')).split('.')[0] }}"
    cluster_minor: "{{ (cluster_version | replace('v', '')).split('.')[1] }}"
    release_major: "{{ (k8s_version | replace('v', '')).split('.')[0] }}"
    release_minor: "{{ (k8s_version | replace('v', '')).split('.')[1] }}"
  tasks:
    # Answered by every cluster that is running, so an empty one is a cluster
    # that could not be asked rather than a cluster without a version
    - name: Check the cluster says which kubernetes version it records
      fail:
        msg: >-
          Node["{{ k8s_cp_nodes[0] }}"] did not say which kubernetes version the cluster
          records. It is read from the kubeadm-config config map of the kube-system
          namespace, so a cluster that can not be reached reads as empty. Check that the
          control plane is up and run this playbook again
      when: cluster_version | length == 0

    - name: Check the release is not older than the cluster
      fail:
        msg: >-
          The cluster records kubernetes["{{ cluster_version }}"] and
          release["{{ ki_release_version }}"] holds kubernetes["{{ k8s_version }}"], which is
          older. kubeadm does not downgrade a cluster, and neither does this. Upgrade to a
          release holding kubernetes["{{ cluster_version }}"] or newer
      when:
        - cluster_version | length > 0
        - k8s_version is version(cluster_version, '<')

    - name: Check the release is at most one kubernetes minor above the cluster
      fail:
        msg: >-
          The cluster records kubernetes["{{ cluster_version }}"] and
          release["{{ ki_release_version }}"] holds kubernetes["{{ k8s_version }}"], which is
          further ahead than the one minor kubeadm upgrades at a time, so this has to go
          through the releases in between. Check upgradable_from of release.yml: it lists a
          release this one can not actually be reached from
      when:
        - cluster_version | length > 0
        - release_major | int != cluster_major | int or release_minor | int > cluster_minor | int + 1

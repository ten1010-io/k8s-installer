# Runs one of the scripts of the bundle on the managed nodes, leaving the control
# node until every other node is done.
#
# For the two docker scripts, which are the ones that rewrite the iptables of the
# node they run on. Starting dockerd creates the docker0 bridge, adds its own
# chains and leaves the FORWARD policy at DROP. Resetting docker runs
# flush-iptables.sh, which disables ufw and firewalld, empties the filter, nat and
# mangle tables and puts the policies of the built in chains back to ACCEPT, so
# what is left is a node with no nat of its own: the published ports of the ki cp
# containers and the service rules of kube-proxy are both gone. Doing either on the
# node ansible is running from can cut the paths it still needs to the other nodes
#
#   - import_playbook: tasks/run-all-node-script-control-node-last.yml
#     vars:
#       script: all-node/docker/setup-docker.sh
#
# That ordering is the only reason this is two plays rather than one with two
# tasks. Within a play the order across hosts is a property of the linear
# strategy, which is merely the default and can be changed in ansible.cfg, while
# plays always run one after the other. Do not merge them
- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: "Execute {{ script | basename }}"
      shell: "sudo {{ ki_opt_scripts_path }}/{{ script }} {{ vars_path_arg }}"
      when:
        - target_node is none or inventory_hostname == target_node
        - inventory_hostname != ki_control_node_ih

- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: "Execute {{ script | basename }}"
      shell: "sudo {{ ki_opt_scripts_path }}/{{ script }} {{ vars_path_arg }}"
      when:
        - target_node is none or inventory_hostname == target_node
        - inventory_hostname == ki_control_node_ih

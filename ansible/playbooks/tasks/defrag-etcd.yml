# Defragments the etcd member of one control plane node at a time, taking the node
# out of every load balancer while its member is blocked and putting it back once
# it is serving again, and disarms the alarms of the cluster once every member has
# been through.
#
# renew-k8s-certs.yml and apply-control-plane-changes.yml are the same play around
# different scripts, and this is the third. The shared play those comments ask for
# is not written here on purpose: apply-control-plane-changes.yml has since grown a
# second script under a condition of its own, so "the play with the script as a
# variable" no longer describes all three, and a play taking a list of steps would
# have to be got right for certificate renewal as well. That is a change worth
# making against a cluster to test it on rather than beside a new playbook.
#
# Defragmentation blocks the member it runs on. The members that are not being
# worked on are what carries the cluster, which is why this is serial and why the
# node is out of rotation while it happens
- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
    lb_admin_cmd: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-cp-lb/lb-admin.sh {{ vars_path_arg }}"
    ki_cp_ihs: "{{ groups['ki_cp_node'] | difference(ki_broken_nodes) }}"
  tasks:
    - when: inventory_hostname in k8s_cp_nodes
      block:
        # Every ki cp node runs a load balancer of its own and the vip can move
        # between them at any moment, so a node is only really out of rotation
        # once every one of them has been told
        - name: Take this node out of the load balancer of every ki cp node
          shell: "{{ lb_admin_cmd }} drain {{ inventory_hostname }}"
          delegate_to: "{{ item }}"
          loop: "{{ ki_cp_ihs }}"

        - name: Execute defrag-etcd.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/defrag-etcd.sh {{ vars_path_arg }}"
          register: shell_result

        - name: Report what the member gave back
          debug:
            msg: "{{ shell_result.stderr_lines }}"

        - name: "Remove temporary variable[\"shell_result\"]"
          set_fact:
            shell_result: null

      # A drained node that is never put back takes no work for good, which is
      # worse than the failure that got here. It goes back into rotation and the
      # run stops after that, so the operator is left with a cluster serving from
      # every node it was serving from before, and with the members that were
      # already defragmented still defragmented
      rescue:
        - name: Put this node back into the load balancer of every ki cp node
          shell: "{{ lb_admin_cmd }} ready {{ inventory_hostname }}"
          delegate_to: "{{ item }}"
          loop: "{{ ki_cp_ihs }}"

        - name: Report that defragmenting failed
          fail:
            msg: >-
              Defragmenting the etcd member of node["{{ inventory_hostname }}"] failed.
              The node was put back into the load balancer of every ki cp node, so it is
              serving again if its apiserver is up. The nodes after it in the inventory
              were not touched, and any alarm this cluster carries is still raised

    - when: inventory_hostname in k8s_cp_nodes
      block:
        - name: Put this node back into the load balancer of every ki cp node
          shell: "{{ lb_admin_cmd }} ready {{ inventory_hostname }}"
          delegate_to: "{{ item }}"
          loop: "{{ ki_cp_ihs }}"

        # Before the next node is taken out. Moving on while this one is not
        # being given traffic again would take the control plane down to one
        # fewer node than it looks like
        - name: Wait for every ki cp node to be giving this node traffic again
          shell: "{{ lb_admin_cmd }} wait-ready {{ inventory_hostname }}"
          delegate_to: "{{ item }}"
          loop: "{{ ki_cp_ihs }}"

# On one node, because an alarm belongs to the cluster rather than to a member,
# and after every member has been through, because an alarm disarmed while a
# member is still out of room is raised again immediately
- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute disarm-etcd-alarms.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/disarm-etcd-alarms.sh {{ vars_path_arg }}"
      register: shell_result
      when: inventory_hostname == k8s_cp_nodes[0]

    - name: Report what the cluster carried
      debug:
        msg: "{{ shell_result.stderr_lines }}"
      when: shell_result.stderr is defined

    - name: "Remove temporary variable[\"shell_result\"]"
      set_fact:
        shell_result: null

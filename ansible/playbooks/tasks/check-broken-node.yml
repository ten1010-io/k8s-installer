# Guards the only removal path that does not touch the node being removed.
#
# Everything else the installer does to a node is done on the node. This one is
# done entirely from the nodes that are left, which means nothing here can
# observe what the node it is removing is actually doing. The two checks below
# are the whole of what can be established before the cluster is changed, so they
# are made explicit rather than assumed.
- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # Being unable to reach a node is not the same as knowing it can not come
    # back. A node that is only cut off from the network still runs keepalived and
    # can still hold the virtual ip, still serves dns and the registry, and is
    # still an etcd member. Removing it from the cluster while it runs leaves two
    # sides of a split, and no check made from this side can tell that apart from
    # a node that is down. Only the operator can, so only the operator can say so
    - name: "Check node[\"{{ target_node }}\"] has been fenced"
      fail:
        msg: >-
          Node["{{ target_node }}"] is about to be removed from the cluster without
          being touched, which is only safe while it can not come back on its own.
          Power it off or cut it off from the network, then run this again with
          -e fenced= to say that it has been done
      when: fenced is not defined

    - name: "Execute ssh on node[\"{{ target_node }}\"]"
      shell: "sudo ssh {{ ssh_opt }} {{ port_opt }} {{ dst_arg }} true"
      vars:
        ssh_opt: "-o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5"
        port_opt: "-p {{ hostvars[target_node]['ansible_port'] }}"
        dst_arg: "{{ hostvars[target_node]['ansible_ssh_user'] }}@{{ hostvars[target_node]['ansible_host'] }}"
      register: shell_result
      failed_when: false
      changed_when: false

    # A node that answers is a node the ordinary removal path can work on, and
    # that path also cleans the node itself up rather than leaving a machine
    # behind that still holds the pki, the installer and a kubelet with valid
    # certificates
    - name: "Check node[\"{{ target_node }}\"] can not be reached"
      fail:
        msg: >-
          Node["{{ target_node }}"] answers over ssh, so it is not broken. Take it
          out of the broken_node group of inventory.yml and remove it with the
          remove-node.yml playbook, which also cleans up the node itself
      when: shell_result.rc == 0

    - name: "Remove temporary variable[\"shell_result\"]"
      set_fact:
        shell_result: null

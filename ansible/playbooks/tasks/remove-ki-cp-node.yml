# keepalived on its own and one node at a time. It is the one ki cp service a
# changed configuration only reaches by a restart, and restarting it is giving
# the vip up. Done on every node at once, that is every node dropping the address
# in the same moment with nobody left to take it, and the cluster waits without
# an apiserver, a dns server or a registry until one of them is back and has won
# an election. Measured on a three node cluster:
#
#   both at once    4.9 seconds with no vip, and it returns to the same node
#   one at a time   1.1 to 1.3 seconds, in handovers of about 0.6 each
#
# keepalived advertises priority zero on its way down and a peer adds the
# address, and the 0.6 seconds is that handover rather than an election: the
# address moves instead of going away and coming back.
#
# More than one handover because of rise 2 on the tracked script. A node that has
# just been restarted cannot take the address for six seconds, so it walks on to
# whichever node is still up and comes back afterwards. Two handovers measured
# for adding a node and two for removing one, three on one run. Holding it to a
# single handover would mean doing the node that has the address last, which is a
# fact to gather before this play can start and is not done here
#
# First, so that the node being removed has given the address up before the load
# balancer that was answering for it is taken away
- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute setup-keepalived.sh --update
      shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/keepalived/setup-keepalived.sh {{ vars_path_arg }} --update"
      when: inventory_hostname != target_node

    - name: Execute reset-keepalived.sh
      shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/keepalived/reset-keepalived.sh {{ vars_path_arg }}"
      when: inventory_hostname == target_node

# The rest of the services of every ki cp node, which a node leaving changes the
# same way it changed them by joining, and which stop for it no more than they
# did then
- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - when: inventory_hostname != target_node
      block:
        - name: Execute setup-dns-server.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/dns-server/setup-dns-server.sh {{ vars_path_arg }} --update"

        - name: Execute setup-ntp-server.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/ntp-server/setup-ntp-server.sh {{ vars_path_arg }} --update"

        - name: Execute setup-k8s-cp-lb.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-cp-lb/setup-k8s-cp-lb.sh {{ vars_path_arg }} --update"

        - name: Execute setup-k8s-registry.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-registry/setup-k8s-registry.sh {{ vars_path_arg }} --update"

        - name: Execute setup-user-registry.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/user-registry/setup-user-registry.sh {{ vars_path_arg }} --update"

    - when: inventory_hostname == target_node
      block:
        - name: Execute reset-dns-server.sh
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/dns-server/reset-dns-server.sh {{ vars_path_arg }}"

        - name: Execute reset-ntp-server.sh
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/ntp-server/reset-ntp-server.sh {{ vars_path_arg }}"

        - name: Execute reset-k8s-cp-lb.sh
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-cp-lb/reset-k8s-cp-lb.sh {{ vars_path_arg }}"

        - name: Execute reset-k8s-registry.sh
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-registry/reset-k8s-registry.sh {{ vars_path_arg }}"

        - name: Execute reset-user-registry.sh
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/user-registry/reset-user-registry.sh {{ vars_path_arg }}"

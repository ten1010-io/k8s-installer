# Puts the artifacts of an archive, images and charts alike, into the user
# registry of every ki cp node.
#
# Every one of them, because every ki cp node runs a registry of its own and a
# pod pulls from whichever node is answering the vip at that moment. Nodes
# holding different artifacts is the failure this exists to prevent: the same
# pod starts or does not depending on where it was scheduled, which is found
# much later than it is caused
- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Validate variable[\"archive\"]"
      fail:
        msg: >-
          Variable["archive"] is not defined. It is the path of the archive
          tools/build-user-registry-artifacts.sh produced, as it is on this node.
          Run with -e archive=<path>
      when: archive is not defined

    - name: "Validate variable[\"archive\"]"
      fail:
        msg: "No such file or directory of which path is \"{{ archive }}\""
      when: not (archive | ansible.builtin.expanduser) is exists

    # Which file the archive is on the machine this runs from: its device, its
    # inode, its size, when it was written and when its inode last changed. The
    # play below reads the archive in place only on a node where the same path
    # shows the same five. The last is there because a copy that keeps the times
    # of a file (cp -p, rsync -a) can not keep that one
    - name: Execute stat
      shell: "stat -c '%d:%i:%s:%Y:%Z' {{ archive | ansible.builtin.expanduser | ansible.builtin.realpath | quote }}"
      register: shell_result
      changed_when: false

    - name: "Set_fact variable[\"archive_file_id\"]"
      set_fact:
        archive_file_id: "{{ shell_result.stdout | trim }}"

    - name: "Remove temporary variable[\"shell_result\"]"
      set_fact:
        shell_result: null

# The control node, where the inventory names one and it is a ki cp node of this
# play, already holds the archive, so it reads it where it is. Copying it there
# went over ssh to the same machine, with a sha1 of the whole archive on each
# side and one more write of it, before anything was pushed. The other ki cp
# nodes are given a copy, and so is the control node when it can not be
# confirmed that root reads the archive where it is (a root_squash NFS home, a
# FUSE mount of the login user), as the copy reads it as the user that runs
# ansible.
#
# This playbook does not import check-control-node.yml, so the node the
# inventory calls the control node is not taken at its word. It reads in place
# only when the file at that path is the very file this run was given: with
# control_node_ih pointing at another machine, a file of the same path there is
# some other archive, and pushing it would leave the nodes holding different
# artifacts. With no control node named, one that is not a ki cp node or one
# that is another machine, every node is given a copy, as before
- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
    # Absolute, because the control node reads it through a shell of its own,
    # under sudo, where ~ and a path relative to here mean another place. The
    # filters run on the machine ansible runs on, from the directory it was started in
    archive_abs_path: "{{ archive | ansible.builtin.expanduser | ansible.builtin.realpath }}"
    node_archive_path: >-
      {{ archive_abs_path if in_place | bool
         else ki_tmp_root_path ~ '/ki-cp-user-registry-artifacts.tgz' }}
  tasks:
    - name: "Create directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "{{ ki_create_tmp_root_cmd }}"

    - name: Check this node holds the archive and root can read it where it is
      shell: >-
        sudo test -r {{ archive_abs_path | quote }}
        && sudo stat -c '%d:%i:%s:%Y:%Z' {{ archive_abs_path | quote }}
      register: shell_result
      changed_when: false
      failed_when: false
      when: inventory_hostname == ki_control_node_ih

    - name: "Set_fact variable[\"in_place\"]"
      set_fact:
        in_place: >-
          {{ inventory_hostname == ki_control_node_ih
             and (shell_result.rc | default(1)) == 0
             and (shell_result.stdout | default('') | trim) == hostvars['localhost']['archive_file_id'] }}

    - name: Say the archive is copied on the control node as well
      debug:
        msg: >-
          It could not be confirmed that this node holds {{ archive_abs_path }} where root can read it
          (sudo test -r failed, or the file at that path is not the one this was started with), so it is
          copied to {{ node_archive_path }} as on the other nodes. To skip the copy, put it on a local
          disk of the node this is run from and have control_node_ih of inventory.yml name that node
      when:
        - inventory_hostname == ki_control_node_ih
        - not (in_place | bool)

    - name: "Remove temporary variable[\"shell_result\"]"
      set_fact:
        shell_result: null

    - name: Copy the archive to the node
      copy:
        src: "{{ archive_abs_path }}"
        dest: "{{ node_archive_path }}"
      become: yes
      when: not (in_place | bool)

    - name: Execute push-user-registry-artifacts.sh
      shell: >-
        sudo {{ ki_opt_scripts_path }}/ki-cp-node/user-registry/push-user-registry-artifacts.sh
        {{ vars_path_arg }} --archive-path {{ node_archive_path | quote }}

    # Never the archive of the operator, which the control node read in place
    - name: Delete the archive from the node
      shell: "sudo rm -f {{ node_archive_path | quote }}"
      when: not (in_place | bool)

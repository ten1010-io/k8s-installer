- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    # The one step of a reset that needs the cluster to still be answering, and
    # so the one that a cluster which never finished coming up can not do. It is
    # skipped with -e sdfc=, which nobody finds from what kubectl prints when it
    # fails - "connection refused" says the apiserver is not there and says
    # nothing about what to do next. The rescue says it
    - when:
        - inventory_hostname == k8s_cp_nodes[0]
        - skip_deleting_from_cluster is undefined
      block:
        - name: Execute delete-all-nodes.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/delete-all-nodes.sh {{ vars_path_arg }}"
          register: shell_result
      rescue:
        - name: Say that the cluster could not be reached and how to reset without it
          fail:
            msg: |-
              delete-all-nodes.sh could not take the nodes out of the cluster:

              {{ shell_result.stderr | default("") | trim }}

              This step asks the apiserver to delete the node objects, so it needs a
              cluster that is still answering. A cluster that never finished coming up,
              or one whose control plane is already gone, can not do it and does not
              need to - there is nothing left to delete from.

              Run the playbook again with -e sdfc= to skip this step. Everything after
              it is done to the nodes themselves and runs the same either way.

- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute reset-k8s-node-kubelet.sh on k8s worker nodes
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/reset-k8s-node-kubelet.sh {{ vars_path_arg }}"
      when: inventory_hostname not in k8s_cp_nodes

    - name: Execute reset-k8s-node-cni.sh on k8s worker nodes
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/reset-k8s-node-cni.sh {{ vars_path_arg }}"
      when: inventory_hostname not in k8s_cp_nodes

    - name: Execute reset-k8s-node-kubelet.sh on k8s cp nodes
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/reset-k8s-node-kubelet.sh {{ vars_path_arg }}"
      throttle: 1
      when: inventory_hostname in k8s_cp_nodes

    - name: Execute reset-k8s-node-cni.sh on k8s cp nodes
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/reset-k8s-node-cni.sh {{ vars_path_arg }}"
      throttle: 1
      when: inventory_hostname in k8s_cp_nodes

    # Every node of the play and not the cp ones alone: the card that was passed
    # through is usually on a worker, and the node is leaving the cluster either
    # way. Nothing here talks to the cluster, so it needs no throttle
    - name: Execute reset-vfio-pci.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/vfio-pci/reset-vfio-pci.sh {{ vars_path_arg }}"

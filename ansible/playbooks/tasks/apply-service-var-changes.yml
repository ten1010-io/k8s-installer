# Applies the changes of class["service"] by writing every ki cp service again.
# Every service rather than the one the variable belongs to: each setup script
# already decides for itself whether anything it renders differs, and reaching
# for the mapping of variable to service would be a second place for that answer
# to live and to be wrong
- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - when: hostvars['localhost']['ki_var_changes']['service'] | length > 0
      block:
        - name: Execute setup-keepalived.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/keepalived/setup-keepalived.sh {{ vars_path_arg }} --update"

        - name: Execute setup-dns-server.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/dns-server/setup-dns-server.sh {{ vars_path_arg }} --update"

        - name: Execute setup-ntp-server.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/ntp-server/setup-ntp-server.sh {{ vars_path_arg }} --update"

        - name: Execute setup-k8s-cp-lb.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-cp-lb/setup-k8s-cp-lb.sh {{ vars_path_arg }} --update"

        - name: Execute setup-k8s-registry.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-registry/setup-k8s-registry.sh {{ vars_path_arg }} --update"

        - name: Execute setup-user-registry.sh --update
          shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/user-registry/setup-user-registry.sh {{ vars_path_arg }} --update"

# The ntp and dns clients of every node read the same variables the servers are
# rendered from, so they are written again alongside them
- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - when: hostvars['localhost']['ki_var_changes']['service'] | length > 0
      block:
        - name: Execute setup-resolv-conf.sh
          shell: "sudo {{ ki_opt_scripts_path }}/all-node/resolv-conf/setup-resolv-conf.sh {{ vars_path_arg }}"

        - name: Execute setup-ntp-client.sh
          shell: "sudo {{ ki_opt_scripts_path }}/all-node/ntp-client/setup-ntp-client.sh {{ vars_path_arg }}"

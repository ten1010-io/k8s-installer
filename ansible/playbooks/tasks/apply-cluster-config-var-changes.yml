# Applies the changes of class["cluster_config"] by writing the kubeadm cluster
# configuration again and uploading it. Nothing kubeadm has already issued
# changes: what this decides is what the next thing it issues looks like.
#
# On one control plane node, since what it updates is a ConfigMap of the cluster
# rather than anything on a node
- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute upload-k8s-cluster-config.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/upload-k8s-cluster-config.sh {{ vars_path_arg }}"
      when:
        - inventory_hostname == k8s_cp_nodes[0]
        - hostvars['localhost']['ki_var_changes']['cluster_config'] | length > 0

- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    tmp_input_path: "{{ ki_tmp_root_path }}/tmp-input.yml"
  tasks:
    - name: "Create output directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "sudo mkdir -p {{ ki_tmp_root_path }}"

    - name: Setup variable[\"hostname\"]
      block:
        - name: Execute hostname
          shell: "sudo hostname"
          register: shell_result

        - name: Set_fact variable[\"hostname\"]
          set_fact:
            hostname: "{{ shell_result.stdout }}"

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

    - name: Setup variable[\"internal_network_interfaces\"]
      block:
        - name: Write temporary file for cli input
          copy:
            content: "{{ hostvars | to_yaml }}"
            dest: "{{ tmp_input_path }}"
          become: yes

        - name: Execute create-internal-network-interfaces.py
          shell: "sudo {{ ansible_python_interpreter }} {{ ki_opt_scripts_path }}/preflight/create-internal-network-interfaces.py {{ inventory_hostname }} < {{ tmp_input_path }}"
          register: shell_result

        - name: Set_fact variable[\"internal_network_interfaces\"]
          set_fact:
            internal_network_interfaces: "{{ shell_result.stdout | from_yaml | community.general.json_query('internal_network_interfaces') }}"

        - name: Remove temporary file for cli input
          shell: "sudo rm {{ tmp_input_path }}"

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

    - name: Setup variable[\"node_resources\"]
      block:
        - name: Execute get-node-resources.sh
          shell: "sudo {{ ki_opt_scripts_path }}/preflight/get-node-resources.sh"
          register: shell_result

        - name: Set_fact variable[\"node_resources\"]
          set_fact:
            node_resources: "{{ shell_result.stdout | from_yaml }}"

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

    - name: Setup variable[\"kubelet_reservations\"]
      block:
        - name: Write temporary file for cli input
          copy:
            content: "{{ hostvars | to_yaml }}"
            dest: "{{ tmp_input_path }}"
          become: yes

        - name: Execute create-kubelet-reservations.py
          shell: "sudo {{ ansible_python_interpreter }} {{ ki_opt_scripts_path }}/preflight/create-kubelet-reservations.py {{ inventory_hostname }} < {{ tmp_input_path }}"
          register: shell_result

        - name: Set_fact variable[\"kubelet_reservations\"]
          set_fact:
            kubelet_reservations: "{{ shell_result.stdout | from_yaml | community.general.json_query('kubelet_reservations') }}"

        - name: Remove temporary file for cli input
          shell: "sudo rm {{ tmp_input_path }}"

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

- hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    tmp_input_path: "{{ ki_tmp_root_path }}/tmp-input.yml"
  tasks:
    - name: "Create output directory[\"{{ ki_tmp_root_path }}\"]"
      shell: "sudo mkdir -p {{ ki_tmp_root_path }}"

    - name: Setup variable[\"hostname\"]
      block:
        - name: Execute hostname
          shell: "sudo hostname"
          register: shell_result

        - name: Set_fact variable[\"hostname\"]
          set_fact:
            hostname: "{{ shell_result.stdout }}"

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

    - name: Setup variable[\"ih_to_hostname_dict\"]
      block:
        - name: Write temporary file for cli input
          copy:
            content: "{{ hostvars | to_yaml }}"
            dest: "{{ tmp_input_path }}"
          become: yes

        - name: Execute create_ih_to_hostname_dict.py
          shell: "sudo {{ ansible_python_interpreter }} {{ ki_opt_scripts_path }}/preflight/create_ih_to_hostname_dict.py < {{ tmp_input_path }}"
          register: shell_result

        - name: Set_fact variable[\"ih_to_hostname_dict\"]
          set_fact:
            ih_to_hostname_dict: "{{ shell_result.stdout | from_yaml | community.general.json_query('ih_to_hostname_dict') }}"

        - name: Set_fact variable[\"hostname_to_ih_dict\"]
          set_fact:
            hostname_to_ih_dict: "{{ shell_result.stdout | from_yaml | community.general.json_query('hostname_to_ih_dict') }}"

        - name: Remove temporary file for cli input
          shell: "sudo rm {{ tmp_input_path }}"

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

    # A node of the broken_node group is left out of every play, so it reports
    # nothing and its hostname is missing from what was just gathered. It is
    # filled in from what the last run recorded, because delete-node.sh and
    # check-node-state.sh identify a node of the cluster by its hostname and have
    # nothing to match it against otherwise.
    #
    # What the nodes reported now wins over the record, and the record is pruned
    # to the inventory, so an entry only survives while its node is still declared
    # and still out of reach
    - name: Setup the part of variable[\"ih_to_hostname_dict\"] the nodes could not report
      block:
        - name: "Read file[\"{{ ki_etc_nodes_path }}\"]"
          shell: "sudo cat {{ ki_etc_nodes_path }} 2>/dev/null || true"
          register: shell_result

        - name: Set_fact variable[\"recorded_ih_to_hostname_dict\"]
          set_fact:
            recorded_ih_to_hostname_dict: "{{ (shell_result.stdout | from_yaml | default({}, true)).get('ih_to_hostname_dict', {}) }}"

        - name: Set_fact variable[\"ih_to_hostname_dict\"]
          set_fact:
            ih_to_hostname_dict: "{{ recorded_ih_to_hostname_dict | combine(ih_to_hostname_dict) | dict2items | selectattr('key', 'in', groups['all']) | items2dict }}"

        - name: Set_fact variable[\"hostname_to_ih_dict\"]
          set_fact:
            hostname_to_ih_dict: "{{ ih_to_hostname_dict | dict2items | items2dict(key_name='value', value_name='key') }}"

        - name: Remove temporary variable[\"recorded_ih_to_hostname_dict\"]
          set_fact:
            recorded_ih_to_hostname_dict: null

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

    - name: Setup variable[\"internal_network_hosts\"]
      block:
        - name: Write temporary file for cli input
          copy:
            content: "{{ hostvars | to_yaml }}"
            dest: "{{ tmp_input_path }}"
          become: yes

        - name: Execute create-internal-network-hosts.py
          shell: "sudo {{ ansible_python_interpreter }} {{ ki_opt_scripts_path }}/preflight/create-internal-network-hosts.py < {{ tmp_input_path }}"
          register: shell_result

        - name: Set_fact variable[\"internal_network_hosts\"]
          set_fact:
            internal_network_hosts: "{{ shell_result.stdout | from_yaml | community.general.json_query('internal_network_hosts') }}"

        - name: Remove temporary file for cli input
          shell: "sudo rm {{ tmp_input_path }}"

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

    - name: Setup variable[\"k8s_cp_nodes\"]
      block:
        - name: Write temporary file for cli input
          copy:
            content: "{{ hostvars | to_yaml }}"
            dest: "{{ tmp_input_path }}"
          become: yes

        - name: Execute create-k8s-cp-nodes.py
          shell: "sudo {{ ansible_python_interpreter }} {{ ki_opt_scripts_path }}/preflight/create-k8s-cp-nodes.py < {{ tmp_input_path }}"
          register: shell_result

        - name: Set_fact variable[\"k8s_cp_nodes\"]
          set_fact:
            k8s_cp_nodes: "{{ shell_result.stdout | from_yaml | community.general.json_query('k8s_cp_nodes') }}"

        - name: Remove temporary file for cli input
          shell: "sudo rm {{ tmp_input_path }}"

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null

    # The password of the stats page is minted once and kept, not made again on
    # every run. A new one on every run changes compose.yml, which makes compose
    # replace the load balancer container, which drops every connection to the
    # apiserver through it: adding or removing a node cost an outage of the
    # whole control plane for that reason alone. It also left the operator with
    # a credential that stopped working the next time anything was run.
    #
    # Read from this node, which the playbooks require to be a ki cp node. Every
    # ki cp node is given the same password, so whichever of them is the control
    # node reads the same value and the cluster keeps one password
    - name: Setup variable[\"ki_cp_k8s_cp_lb_stats_admin_pw\"]
      block:
        - name: Read the password of the stats page this cluster already has
          shell: "sudo cat {{ ki_cp_k8s_cp_lb_stats_password_path }} 2>/dev/null || true"
          register: existing_password_result

        - name: Set_fact variable[\"ki_cp_k8s_cp_lb_stats_admin_pw\"] from the one it has
          set_fact:
            ki_cp_k8s_cp_lb_stats_admin_pw: "{{ existing_password_result.stdout | trim }}"
          when: existing_password_result.stdout | trim | length > 0

        - name: Execute generate-password.sh
          shell: "sudo {{ ki_opt_scripts_path }}/preflight/generate-password.sh"
          register: shell_result
          when: existing_password_result.stdout | trim | length == 0

        - name: Set_fact variable[\"ki_cp_k8s_cp_lb_stats_admin_pw\"] from a new one
          set_fact:
            ki_cp_k8s_cp_lb_stats_admin_pw: "{{ shell_result.stdout }}"
          when: existing_password_result.stdout | trim | length == 0

        - name: Remove temporary variable[\"shell_result\"]
          set_fact:
            shell_result: null
            existing_password_result: null

    - name: Setup variable[\"localhost_ih\"]
      block:
        - name: Set_fact variable[\"localhost_ih\"]
          set_fact:
            localhost_ih: "{{ hostname_to_ih_dict[hostname] | default(None) }}"

- hosts: all:!localhost:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Set_fact variable[\"ih_to_hostname_dict\"]
      set_fact:
        ih_to_hostname_dict: "{{ hostvars['localhost']['ih_to_hostname_dict'] }}"

    - name: Set_fact variable[\"hostname_to_ih_dict\"]
      set_fact:
        hostname_to_ih_dict: "{{ hostvars['localhost']['hostname_to_ih_dict'] }}"

    - name: Set_fact variable[\"internal_network_hosts\"]
      set_fact:
        internal_network_hosts: "{{ hostvars['localhost']['internal_network_hosts'] }}"

    - name: Set_fact variable[\"k8s_cp_nodes\"]
      set_fact:
        k8s_cp_nodes: "{{ hostvars['localhost']['k8s_cp_nodes'] }}"

    - name: Set_fact variable[\"ki_cp_k8s_cp_lb_stats_admin_pw\"]
      set_fact:
        ki_cp_k8s_cp_lb_stats_admin_pw: "{{ hostvars['localhost']['ki_cp_k8s_cp_lb_stats_admin_pw'] }}"

    - name: Set_fact variable[\"localhost_ih\"]
      set_fact:
        localhost_ih: "{{ hostvars['localhost']['localhost_ih'] }}"

# Recorded after the facts are gathered, so that what is written is what the
# nodes reported on this run. Every node of the ki_cp_node group holds it, for
# the same reason every one of them holds the ansible directory: the record is
# only ever needed once a node is gone, and the control node may be the node that
# is gone
- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Create directory[\"{{ ki_etc_root_path }}\"]"
      shell: "sudo mkdir -p {{ ki_etc_root_path }}"

    - name: "Record the nodes of the inventory in file[\"{{ ki_etc_nodes_path }}\"]"
      copy:
        content: "{{ { 'ih_to_hostname_dict': hostvars['localhost']['ih_to_hostname_dict'] } | to_nice_yaml }}"
        dest: "{{ ki_etc_nodes_path }}"
      become: yes

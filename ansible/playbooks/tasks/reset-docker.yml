# Resetting docker stops the daemon and then runs flush-iptables.sh, which
# disables ufw and firewalld, empties the filter, nat and mangle tables and puts
# the policies of the built in chains back to ACCEPT. What that leaves is a node
# with no nat of its own, so the published ports of the ki cp containers and the
# service rules of kube-proxy are both gone. Doing that on the node ansible is
# running from can cut the paths it still needs to the other nodes, and more work
# follows this than follows setup-docker.yml, so the control node is handled only
# once every other node is done.
#
# That ordering is the only reason this is two plays rather than one with two
# tasks. Within a play the order across hosts is a property of the linear
# strategy, which is merely the default and can be changed in ansible.cfg, while
# plays always run one after the other. Do not merge them
- hosts: all:!localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute reset-docker.sh
      shell: "sudo {{ ki_opt_scripts_path }}/all-node/docker/reset-docker.sh {{ vars_path_arg }}"
      when:
        - target_node is none or inventory_hostname == target_node
        - inventory_hostname != ki_control_node_ih

- hosts: all:!localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute reset-docker.sh
      shell: "sudo {{ ki_opt_scripts_path }}/all-node/docker/reset-docker.sh {{ vars_path_arg }}"
      when:
        - target_node is none or inventory_hostname == target_node
        - inventory_hostname == ki_control_node_ih

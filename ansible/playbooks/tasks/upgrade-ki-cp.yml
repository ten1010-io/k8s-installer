# Brings the ki cp services to the images of the release the installer now holds,
# and fills the registry with the container images of the new kubernetes version.
#
# Before any node is upgraded. kubeadm pulls what it needs from that registry
# while it upgrades, and on an air gapped cluster there is nowhere else for those
# images to come from, so a node upgraded first would have nothing to pull
#
# One node at a time. These services are what the vip is an address for, and
# keepalived is replaced along with the rest: doing every ki cp node at once
# leaves no node holding the vip at all, which measured as nine seconds of the
# control plane being unreachable. Taken one at a time the vip moves to the node
# that is not being touched, and nopreempt leaves it there
- hosts: ki_cp_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute setup-k8s-registry.sh --update
      shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-registry/setup-k8s-registry.sh {{ vars_path_arg }} --update"

    - name: Execute setup-keepalived.sh --update
      shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/keepalived/setup-keepalived.sh {{ vars_path_arg }} --update"

    - name: Execute setup-dns-server.sh --update
      shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/dns-server/setup-dns-server.sh {{ vars_path_arg }} --update"

    - name: Execute setup-ntp-server.sh --update
      shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/ntp-server/setup-ntp-server.sh {{ vars_path_arg }} --update"

    - name: Execute setup-k8s-cp-lb.sh --update
      shell: "sudo {{ ki_opt_scripts_path }}/ki-cp-node/k8s-cp-lb/setup-k8s-cp-lb.sh {{ vars_path_arg }} --update"

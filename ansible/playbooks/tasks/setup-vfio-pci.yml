# Writes the vfio-pci configuration of a node and, where the site allows it,
# reboots the node so that the configuration is in force before anything else is
# put on the machine.
#
# This used to sit inside add-k8s-node.yml and init-k8s-cluster.yml, which is
# too late to reboot from. By the time those run, a ki cp node is already serving
# the dns, the ntp and the registry that the other nodes are about to use, and
# once add-node.yml has finished the node is carrying pods. Deferring the reboot
# does not avoid it, it moves it to the most expensive moment - the operator ends
# up draining a live node by hand for something the installer could have done
# while the machine was still empty.
#
# Here, the node has had its packages checked and nothing else. It is also the
# last point at which a reboot is free of consequences for the run itself: the
# temporary directory is /tmp/k8s-installer and the only thing in it yet is the
# vars file, which setup-vars-file.yml below writes again. The pki, the ca
# certificate and the join credentials all land there after this
- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - when: target_node is none or inventory_hostname == target_node
      block:
        - name: Execute setup-vfio-pci.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/vfio-pci/setup-vfio-pci.sh {{ vars_path_arg }}"

# The control node is the machine ansible is running from, so rebooting it takes
# the run with it. Unlike the docker scripts, which only need the control node
# left until last, there is no ordering that makes this possible - the playbook
# would never reach its end and nothing would be recorded. That node falls back
# to what every node does when the reboot is off: it is told, and
# check-vfio-pci.yml goes on telling it at the end of every run until someone
# reboots it
- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - when:
        - target_node is none or inventory_hostname == target_node
        - vfio_pci_device_ids | length > 0
      block:
        - name: Report that the control node has to be rebooted by hand
          debug:
            msg: >-
              Node["{{ inventory_hostname }}"] is the control node, which this playbook runs on
              and can not reboot. Its vfio-pci configuration is written and takes effect when
              you reboot it yourself
          when:
            - vfio_pci_reboot | bool
            - inventory_hostname == ki_control_node_ih

        # Unconditional on purpose, and that is safe because of where this file is
        # imported rather than because of anything asked here. It has no "only if
        # the node needs one" test: every node of the block above is rebooted, so
        # what keeps this from rebooting a running cluster is that setup-cluster.yml
        # imports it while every node is being built and add-node.yml imports it
        # with target_node set to the one node it is building. update-cluster.yml,
        # which is the playbook that runs against nodes already carrying pods, does
        # not import it at all.
        #
        # So whoever adds this import somewhere else has to check that, or give the
        # task a test of its own. Run with target_node unset against a cluster that
        # exists, it reboots every node naming a device whether or not any of them
        # has anything to gain by it.
        #
        # The timeout is generous on purpose. The machines this is for are the ones
        # that take longest to come back: a node with several cards and a lot of
        # memory spends minutes in firmware before the kernel is reached at all
        - name: Reboot the node so that it comes up with its devices bound to vfio-pci
          reboot:
            reboot_timeout: 1800
          become: yes
          when:
            - vfio_pci_reboot | bool
            - inventory_hostname != ki_control_node_ih

        # Having rebooted on purpose, a node that comes back without its devices
        # bound is a failure rather than a notice: the run was asked to deliver a
        # working node and has not. Nothing has been built on it yet, so stopping
        # here costs the least it ever will
        - name: Execute check-vfio-pci.sh
          shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/vfio-pci/check-vfio-pci.sh --node {{ inventory_hostname }} {{ vfio_pci_device_ids | join(' ') }}"
          register: shell_result
          when:
            - vfio_pci_reboot | bool
            - inventory_hostname != ki_control_node_ih

        - name: Refuse a node that was rebooted and did not take its vfio-pci configuration
          fail:
            msg: "{{ shell_result.stdout_lines }}"
          when:
            - shell_result.stdout is defined
            - shell_result.stdout | trim | length > 0

        - name: "Remove temporary variable[\"shell_result\"]"
          set_fact:
            shell_result: null

# The reboot above may have taken /tmp with it, and every script after this reads
# the vars file from there. Written again rather than conditioned on whether any
# node actually rebooted: it is a file copy, and a run that skipped it on the one
# node that needed it would fail much later and much less clearly
- import_playbook: setup-vars-file.yml

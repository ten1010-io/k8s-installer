- hosts: all:!broken_node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate variable[\"playbook\"]
      fail:
        msg: "Variable[\"playbook\"] is not defined"
      when: playbook is not defined

    - name: Set_fact variable[\"playbook\"]
      set_fact:
        playbook: "{{ playbook }}"

    - name: Set_fact variable[\"skip_deleting_from_cluster\"]
      set_fact:
        skip_deleting_from_cluster: ""
      when: sdfc is defined

    - name: Set_fact variable[\"skip_resetting_vars_file\"]
      set_fact:
        skip_resetting_vars_file: ""
      when: srvf is defined

    # Development only. It lets upgrade-cluster.yml run against a cluster whose
    # release says nothing about what it holds, which is every cluster this
    # repository is tested on. See check-cluster-upgradable.yml
    - name: Set_fact variable[\"allow_upgrading_from_snapshot\"]
      set_fact:
        allow_upgrading_from_snapshot: ""
      when: aus is defined

    # node names the nodes the playbook works on. add-node takes several at once,
    # as one argument with commas between the names, and remove-node takes one:
    # taking several out at once shrinks the etcd quorum and the keepalived peers
    # in one step, and remove-broken-node refuses the same thing for the same
    # reason. Either way what the plays read is target_nodes, a list, so that a
    # task asks "is this node one of them" whether there is one or five
    - when: playbook == "add-node" or playbook == "remove-node"
      block:
        - name: Validate variable[\"node\"]
          fail:
            msg: >-
              Variable["node"] is not defined. Name the node to work on with -e node=<name>
              {% if playbook == "add-node" %}
              or several of them with -e node=<name>,<name>
              {% endif %}
          when: node is not defined

        # A yaml list on the command line is taken as it is, and the usual form, a
        # string, is split on commas. Names are trimmed because "node4, node5" is
        # what a person types, and repeated names are collapsed because a node
        # named twice would be built twice by every task below
        - name: Set_fact variable[\"target_nodes\"] and variable[\"target_node_op\"]
          set_fact:
            target_nodes: >-
              {{ ((node if node is not string else node.split(','))
                  | map('trim') | reject('equalto', '') | unique | list) }}
            target_node_op: "{{ 'add' if playbook == 'add-node' else 'remove' }}"

        - name: Validate variable[\"node\"]
          fail:
            msg: "Variable[\"node\"] names no node"
          when: target_nodes | length == 0

        - name: Validate variable[\"node\"]
          fail:
            msg: >-
              remove-node takes one node and was given {{ target_nodes | length }}:
              {{ target_nodes | join(', ') }}. Nodes are removed one at a time, because
              each removal takes the etcd quorum and the ki cp services of the nodes that
              are left through a change
          when:
            - playbook == "remove-node"
            - target_nodes | length != 1

        - name: Validate variable[\"node\"]
          fail:
            msg: "Node[\"{{ item }}\"] not belong to all group"
          loop: "{{ target_nodes }}"
          when: item not in groups['all']

        - name: Validate variable[\"node\"]
          fail:
            msg: "Node[\"{{ item }}\"] must belong to ki_cp_node or k8s_node group"
          loop: "{{ target_nodes }}"
          when:
            - item not in groups['ki_cp_node']
            - item not in groups['k8s_node']

        # Both playbooks work on the node itself, which is the one thing a node of
        # the broken_node group can not be asked to do
        - name: Validate variable[\"node\"]
          fail:
            msg: >-
              Node["{{ item }}"] is in the broken_node group, so this playbook can not
              reach it.
              {% if playbook == "remove-node" %}
              Run the remove-broken-node.yml playbook instead, which takes it out of the
              cluster from the nodes that are still up
              {% else %}
              Rebuild it and take it out of the broken_node group of inventory.yml first
              {% endif %}
          loop: "{{ target_nodes }}"
          when: item in ki_broken_nodes

        # Joining a control plane node adds an etcd member, and kubeadm wants those
        # one at a time. One per run rather than one at a time within the run: a
        # run that fails after the first of two has joined leaves a cluster whose
        # membership nobody asked for, and the record of what was applied is written
        # only at the end. Workers join nothing but the apiserver and are not limited.
        # Read off the inventory rather than off k8s_cp_nodes, which gather-facts.yml
        # has not derived yet
        - name: Validate variable[\"node\"]
          fail:
            msg: >-
              {{ cp_targets | length }} of the nodes named are control plane nodes:
              {{ cp_targets | join(', ') }}. add-node takes one control plane node per
              run, because each one joins the etcd cluster. Add them one run at a time,
              with any number of worker nodes beside each
          vars:
            cp_declared: >-
              {{ dict(groups['k8s_node'] | zip(groups['k8s_node'] | map('extract', hostvars, 'k8s_cp')))
                 | dict2items | selectattr('value') | map(attribute='key') | list }}
            cp_targets: "{{ target_nodes | intersect(cp_declared) }}"
          when:
            - playbook == "add-node"
            - cp_targets | length > 1

    # node is optional here. Named, it is the one node this reboots and nothing is
    # asked about it; left out, the playbook decides which nodes need a reboot from
    # what they are configured to boot with. all_nodes takes every node whether or
    # not the installer can see a reason, which is what a kernel or a package
    # replaced under a running node needs
    - when: playbook == "reboot-nodes"
      block:
        - name: "Validate variable[\"node\"] and variable[\"all_nodes\"]"
          fail:
            msg: >-
              Variable["node"] and variable["all_nodes"] are both given and they ask for
              different things. Name one node, or pass all_nodes to take every one of them
          when:
            - node is defined
            - all_nodes is defined

        - name: "Set_fact variable[\"reboot_all_nodes\"]"
          set_fact:
            reboot_all_nodes: ""
          when: all_nodes is defined

        - when: node is defined
          block:
            - name: "Validate variable[\"node\"]"
              fail:
                msg: "Node[\"{{ node }}\"] not belong to all group"
              when: node not in groups['all']

            # The k8s nodes are the ones this playbook walks. A node that is only a
            # ki cp node carries no workload and no kubelet, so there is nothing here
            # to drain or to wait for - its services come back with docker when the
            # machine does, and rebooting it is a machine that somebody reboots
            - name: "Validate variable[\"node\"]"
              fail:
                msg: >-
                  Node["{{ node }}"] must belong to the k8s_node group. A node that is only a
                  ki cp node is not taken through this playbook
              when: node not in groups['k8s_node']

            - name: "Validate variable[\"node\"]"
              fail:
                msg: >-
                  Node["{{ node }}"] is in the broken_node group, so this playbook can not
                  reach it. Rebuild it and take it out of that group first
              when: node in ki_broken_nodes

            # Refused here rather than reported by the play. The no-argument mode
            # reports the control node and carries on with the others, which is
            # the whole of what it can do; a run asked for this one node and
            # nothing else would otherwise end successfully having rebooted nothing
            - name: "Validate variable[\"node\"]"
              fail:
                msg: >-
                  Node["{{ node }}"] is the control node, which this playbook runs on and can
                  not reboot. Hand the control node over to another ki cp node by changing
                  control_node_ih of inventory.yml, then run this playbook from there with
                  -e node={{ node }}
              when: node == ki_control_node_ih

            - name: "Set_fact variable[\"target_nodes\"]"
              set_fact:
                target_nodes: ["{{ node }}"]

    # The node is named by the inventory rather than by a variable on the command
    # line. It has to be in the broken_node group for the plays to leave it out,
    # and naming it a second place would be a second place to get it wrong
    - when: playbook == "remove-broken-node"
      block:
        - name: "Validate group[\"broken_node\"]"
          fail:
            msg: >-
              The broken_node group holds {{ ki_broken_nodes | length }} nodes,
              but this playbook removes exactly one. Declare the group in inventory.yml and put
              the node that can no longer be reached in it. Nodes are removed one at a time,
              because each removal takes the nodes that are left through a reconfiguration
          when: ki_broken_nodes | length != 1

        - name: "Validate group[\"broken_node\"]"
          fail:
            msg: "Node[\"{{ ki_broken_nodes[0] }}\"] must belong to ki_cp_node or k8s_node group"
          when:
            - ki_broken_nodes[0] not in groups['ki_cp_node']
            - ki_broken_nodes[0] not in groups['k8s_node']

        - name: Set_fact variable[\"target_nodes\"] and variable[\"target_node_op\"]
          set_fact:
            target_nodes: ["{{ ki_broken_nodes[0] }}"]
            target_node_op: remove

# Applies the changes of class["kubelet"]. The cluster wide baseline goes up
# first, from one control plane node, because every node reads its own
# configuration back from that ConfigMap
- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute upload-k8s-kubelet-config.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/upload-k8s-kubelet-config.sh {{ vars_path_arg }}"
      when:
        - inventory_hostname == k8s_cp_nodes[0]
        - hostvars['localhost']['ki_var_changes']['kubelet'] | length > 0

# Then every node writes its own, which is the baseline patched with what was
# calculated for the capacity of that node, and restarts kubelet to read it.
#
# One node at a time. Restarting kubelet does not stop the containers it is
# running, so this is not a disruption, but taking every kubelet of the cluster
# down at the same moment would leave nothing watching any of them for as long
# as it took them all to come back
- hosts: k8s_node:!broken_node
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  vars:
    vars_path_arg: "--vars-path {{ ki_tmp_vars_path }}"
  tasks:
    - name: Execute update-k8s-node-kubelet.sh
      shell: "sudo {{ ki_opt_scripts_path }}/k8s-node/update-k8s-node-kubelet.sh {{ vars_path_arg }}"
      when: hostvars['localhost']['ki_var_changes']['kubelet'] | length > 0
